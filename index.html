<title>Mapa de riesgos — Cuenca amazónica</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --3is-navy:#063B6D; --3is-teal-deep:#135879; --3is-cyan:#207685;
    --3is-aqua:#41C0A6; --3is-teal:#4CDBB0; --3is-gray:#E6E6E6;
    --3is-aqua-tint:#D4F5EE; --3is-peach:#FFDAB9; --3is-coral:#FD956F; --3is-mustard:#F4B942;
    --radius: 10px;
    --border: var(--3is-gray);
    --border-strong: var(--3is-cyan);
    --text-primary: #000000;
    --text-secondary: var(--3is-teal-deep);
    --text-muted: #6b7583;
    --surface-1: var(--3is-gray);
    --surface-2: #ffffff;
    --font-sans: 'Montserrat', sans-serif;
    --fill-primary: var(--3is-teal);
    --on-primary: var(--3is-navy);
  }
  #av-3is-root, #av-3is-root * { font-family: var(--font-sans); box-sizing: border-box; }
  #av-3is-root { background: #ffffff; border: 1px solid var(--3is-gray); border-radius: 16px; overflow: hidden; }
  #av-3is-body { padding: 1.5rem; }
  #map { height: 420px; border-radius: var(--radius); z-index: 0; }
  select, input[type=checkbox] { font-family: var(--font-sans); }
  select { border: 1px solid var(--3is-cyan); border-radius: var(--radius); padding: 5px 10px; font-size: 13px; color: var(--3is-teal-deep); background: #fff; }
  button#infoBtn { border: 1px solid var(--3is-cyan); border-radius: var(--radius); padding: 5px 12px; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  .chip { font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--3is-cyan); background: transparent; color: var(--3is-teal-deep); cursor: pointer; }
  .chip.active { background: var(--3is-teal); color: var(--3is-navy); border-color: var(--3is-teal); font-weight: 700; }
  .leaflet-popup-content-wrapper { background: #fff; color: var(--text-primary); border-radius: 8px; font-family: var(--font-sans); border: 1px solid var(--3is-gray); }
  .leaflet-popup-tip { background: #fff; }
  .stat-card { background: var(--3is-gray); border-radius: var(--radius); padding: 1rem; }
  .stat-card p:first-child { font-size: 13px; color: var(--3is-teal-deep); margin: 0; font-weight: 500; }
  .stat-card p:last-child { font-size: 24px; font-weight: 800; margin: 4px 0 0; color: var(--3is-navy); }
  .brand-divider { height: 6px; background: linear-gradient(90deg, var(--3is-aqua) 0%, var(--3is-cyan) 55%, var(--3is-navy) 100%); }
  .dot-field { position:absolute; inset:0; opacity:0.15;
    background-image: radial-gradient(circle, #ffffff 1px, transparent 1.4px);
    background-size: 14px 14px; }
</style>

    bordersNote:"Los datos geográficos, nombres y límites políticos y administrativos utilizados en este mapa no implican aceptación oficial por parte de 3iS.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Niveles de alerta</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Rojo</span>: evento mayor o de rápida escalada, con consecuencias humanitarias, ambientales, agrícolas o de medios de vida significativas.</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Naranja</span>: evento significativo que requiere monitoreo y es potencialmente relevante para acción humanitaria o anticipatoria.</p>
      <p style="margin:0 0 12px"><span style="color:#639922">● Verde</span>: evento relevante de impacto limitado, o en etapa temprana, que requiere monitoreo.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Metodología y fuentes</b></p>
      <p style="margin:0 0 4px">Jerarquía de fuentes: Nivel 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, servicios meteorológicos/geológicos nacionales) → Nivel 2 (WFP, IFRC, Cruz Roja) → Nivel 3 (medios acreditados) → Nivel 4 (redes sociales, solo como pista, nunca confirmación única).</p>
      <p style="margin:0 0 4px">Cada evento requiere verificación cruzada cuando es posible (idealmente fuente oficial + humanitaria, o fuente oficial + medio acreditado). Si solo hay una fuente confiable: <code>SINGLE_SOURCE</code>. Si las fuentes se contradicen: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0">Coordenadas en WGS84 (EPSG:4326). La cobertura geográfica se limita a Bolivia, Brasil, Colombia, Ecuador, Perú y Venezuela; un evento dentro de un país elegible no se incluye automáticamente si ocurre fuera de la cuenca amazónica.</p>
      <p style="margin:8px 0 0"><a href="https://gdacs.org/" target="_blank" style="color:var(--3is-cyan)">GDACS ↗</a> · <a href="https://reliefweb.int/" target="_blank" style="color:var(--3is-cyan)">ReliefWeb ↗</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS ↗</a> · <a href="https://apps.atmosphere.copernicus.eu/fire-emissions-watch/" target="_blank" style="color:var(--3is-cyan)">Copernicus CAMS ↗</a></p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alcance del proyecto</b></p>
      <p style="margin:4px 0 0">Este monitor apoya "Strengthening Response Capacity in the Amazon Basin", financiado por la Comisión Europea (DG ECHO), implementado del 01/06/2026 al 31/05/2028 por un consorcio liderado por Diakonie Katastrophenhilfe (DKH) junto con World Vision, 3iS y PREDES. Cobertura: Bolivia, Brasil, Colombia, Ecuador, Perú y Venezuela.</p>

  pt: { title:"Mapa de riscos — Bacia amazônica", subtitle:"Eventos ativos por perigo e prioridade", mapNote:"Mapa base OpenStreetMap. Dados: base própria de eventos verificados (ver lista à direita).",

    Brazil:"Brasil", Peru:"Peru", Colombia:"Colômbia", Bolivia:"Bolívia", Ecuador:"Equador", Venezuela:"Venezuela",

    legendShape:"Forma = tipo de perigo", legendColor:"Cor = nível de ameaça", methodology:"Metodologia", info:"Info", borders:"Limites nacionais", alertsPanel:"Alertas",

    bordersNote:"Os dados geográficos, nomes e limites políticos e administrativos utilizados neste mapa não implicam aceitação oficial por parte da 3iS.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Níveis de alerta</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Vermelho</span>: evento maior ou de rápida escalada, com consequências humanitárias, ambientais, agrícolas ou de meios de vida significativas.</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Laranja</span>: evento significativo que exige monitoramento e é potencialmente relevante para ação humanitária ou antecipatória.</p>
      <p style="margin:0 0 12px"><span style="color:#639922">● Verde</span>: evento relevante de impacto limitado, ou em estágio inicial, que exige monitoramento.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Metodologia e fontes</b></p>
      <p style="margin:0 0 4px">Hierarquia de fontes: Nível 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, serviços meteorológicos/geológicos nacionais) → Nível 2 (WFP, IFRC, Cruz Vermelha) → Nível 3 (mídia credenciada) → Nível 4 (redes sociais, apenas como pista, nunca confirmação única).</p>
      <p style="margin:0 0 4px">Cada evento exige verificação cruzada quando possível (idealmente fonte oficial + humanitária, ou fonte oficial + mídia credenciada). Se houver apenas uma fonte confiável: <code>SINGLE_SOURCE</code>. Se as fontes se contradizem: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0">Coordenadas em WGS84 (EPSG:4326). A cobertura geográfica se limita à Bolívia, Brasil, Colômbia, Equador, Peru e Venezuela; um evento dentro de um país elegível não é incluído automaticamente se ocorrer fora da bacia amazônica.</p>

      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alcance do projeto</b></p>
      <p style="margin:4px 0 0">Este monitor apoia o "Strengthening Response Capacity in the Amazon Basin", financiado pela Comissão Europeia (DG ECHO), implementado de 01/06/2026 a 31/05/2028 por um consórcio liderado pela Diakonie Katastrophenhilfe (DKH), junto com World Vision, 3iS e PREDES. Cobertura: Bolívia, Brasil, Colômbia, Equador, Peru e Venezuela.</p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88;font-size:11px;font-weight:700">Elaborado por:</p>
      <p style="margin:2px 0 0;font-size:11px;font-style:italic">Jerson ACHICANOY — GIS Expert — 3iS<br><a href="mailto:jachicanoy@3is.org" style="color:var(--3is-cyan)">jachicanoy@3is.org</a></p>` },
  en: { title:"Risk map — Amazon Basin", subtitle:"Active events by hazard and priority", mapNote:"Base map: OpenStreetMap. Data: our own base of verified events (see list on the right).",
    total:"Events", red:"Red alerts", countries:"Countries affected",
    all:"All", FLOOD:"Flood", EXTREME_RAIN:"Extreme rain", DROUGHT:"Drought", WILDFIRE:"Wildfire", EARTHQUAKE:"Earthquake", LANDSLIDE:"Landslide",
    Brazil:"Brazil", Peru:"Peru", Colombia:"Colombia", Bolivia:"Bolivia", Ecuador:"Ecuador", Venezuela:"Venezuela",
    RED:"Red", ORANGE:"Orange", GREEN:"Green", updated:"Updated", source:"Source", readMore:"Read more",
    legendShape:"Shape = hazard type", legendColor:"Color = threat level", methodology:"Methodology", info:"Info", borders:"National borders", alertsPanel:"Alerts",
    dateFrom:"From", dateTo:"To", dateClear:"Clear", lastUpdated:"Last updated",
    layerNews:"News", layerFirms:"Satellite Imagery (FIRMS)",
    dataSourcesHTML:`Data sources: <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color:var(--3is-cyan)">OpenStreetMap</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS</a> (VIIRS heat spots) · <a href="https://apps.atmosphere.copernicus.eu/fire-emissions-watch/" target="_blank" style="color:var(--3is-cyan)">Copernicus CAMS — Fire Emissions Watch ↗</a> (animated fire-emissions view, external tool)`,
    bordersNote:"The geographic data, names, and political and administrative boundaries used on this map do not imply official acceptance by 3iS.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Alert levels</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Red</span>: major or rapidly escalating event with significant humanitarian, environmental, agricultural, or livelihood consequences.</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Orange</span>: significant event requiring monitoring and potentially relevant to humanitarian or anticipatory action.</p>
      <p style="margin:0 0 12px"><span style="color:#639922">● Green</span>: relevant event with limited impacts, or an early-stage event requiring monitoring.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Methodology and sources</b></p>
      <p style="margin:0 0 4px">Source hierarchy: Tier 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, national meteorological/geological services) → Tier 2 (WFP, IFRC, Red Cross) → Tier 3 (credible media) → Tier 4 (social media, lead only, never sole confirmation).</p>
      <p style="margin:0 0 4px">Every event requires cross-checking when possible (ideally official + humanitarian source, or official + credible media). If only one reliable source exists: <code>SINGLE_SOURCE</code>. If sources conflict: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0">Coordinates in WGS84 (EPSG:4326). Geographic coverage is limited to Bolivia, Brazil, Colombia, Ecuador, Peru, and Venezuela; an event in an eligible country is not automatically included if it occurs outside the Amazon Basin.</p>
      <p style="margin:8px 0 0"><a href="https://gdacs.org/" target="_blank" style="color:var(--3is-cyan)">GDACS ↗</a> · <a href="https://reliefweb.int/" target="_blank" style="color:var(--3is-cyan)">ReliefWeb ↗</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS ↗</a> · <a href="https://apps.atmosphere.copernicus.eu/fire-emissions-watch/" target="_blank" style="color:var(--3is-cyan)">Copernicus CAMS ↗</a></p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Project scope</b></p>
      <p style="margin:4px 0 0">This monitor supports "Strengthening Response Capacity in the Amazon Basin," funded by the European Commission (DG ECHO), implemented from 01/06/2026 to 31/05/2028 by a consortium led by Diakonie Katastrophenhilfe (DKH) together with World Vision, 3iS, and PREDES. Coverage: Bolivia, Brazil, Colombia, Ecuador, Peru, and Venezuela.</p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88;font-size:11px;font-weight:700">Prepared by:</p>
      <p style="margin:2px 0 0;font-size:11px;font-style:italic">Jerson ACHICANOY — GIS Expert — 3iS<br><a href="mailto:jachicanoy@3is.org" style="color:var(--3is-cyan)">jachicanoy@3is.org</a></p>` }

const EVENTS = [{"id":"AMZ-20260907-001","country":"Peru","hazard":"FLOOD","priority":"ORANGE","status":"OBSERVED","basinStatus":"INSIDE","verification":"MULTIPLE_SOURCES","lat":-5.8942,"lon":-76.1122,"coordAccuracy":"MUNICIPALITY_APPROXIMATION","firstDetected":"2026-09-07","lastUpdated":"2026-09-08","updateCount":"1","eventDate":"2026-09-07","adminLevel1":"Loreto","adminLevel2":"Alto Amazonas","municipality":"Yurimaguas","locality":"Varios sectores urbanos, incl. acceso al Hospital Santa Gema","title":{"es":"Lluvias torrenciales inundan calles y viviendas en Yurimaguas","pt":"Chuvas torrenciais inundam ruas e casas em Yurimaguas","en":"Torrential rain floods streets and homes in Yurimaguas"},"desc":{"es":"Varias horas de lluvia intensa y súbita, tras un periodo previo de calor y escasez de lluvias, provocaron inundación urbana rápida en Yurimaguas. Calles, sistemas de drenaje y viviendas quedaron anegadas; el agua alcanzó el acceso de emergencias del Hospital Santa Gema, obligando a pacientes a cruzar con el agua hasta las rodillas.","pt":"Várias horas de chuva intensa e repentina, após um período anterior de calor e escassez de chuvas, provocaram inundação urbana rápida em Yurimaguas. Ruas, sistemas de drenagem e residências ficaram alagadas; a água atingiu o acesso de emergência do Hospital Santa Gema, obrigando pacientes a atravessar com água até os joelhos.","en":"Several hours of intense, sudden rainfall, following a preceding stretch of heat and low rainfall, caused rapid urban flooding in Yurimaguas. Streets, drainage systems, and homes were inundated; floodwater reached the emergency entrance of Hospital Santa Gema, forcing patients to wade through knee-deep water."},"notes":{"es":"Sin cifras oficiales de daños/afectados de INDECI o el COER Loreto al momento del reporte. Se recomienda seguimiento.","pt":"Sem números oficiais de danos/afetados do INDECI ou do COER Loreto até o momento do relato. Recomenda-se acompanhamento.","en":"No official damage/affected mbinada com o padrão de estiagem. Huallaga (estação Lagunas): Alerta Hidrológico Vermelho desde 5 de setembro, 111,01 m acima do nível do mar, 1,08 m abaixo do normal, com quedas de 3-6 cm/dia. Amazonas (estação ENAPU/Iquitos): Alerta Hidrológico Amarelo, 109,44 m acima do nível do mar, 0,18 m abaixo do normal, com quedas de 14-20 cm/dia. Preocupação com interrupção do transporte fluvial e efeitos econômicos decorrentes.","en":"SENAMHI reports that the Huallaga and Amazonas rivers in Loreto are falling faster than normal due to reduced upstream rainfall combined with the dry-season pattern. Huallaga (Lagunas gauge): Red Hydrological Alert since 5 September, 111.01 m a.s.l., 1.08 m below normal, falling 3-6 cm/day. Amazonas (ENAPU/Iquitos gauge): Yellow Hydrological Alert, 109.44 m a.s.l., 0.18 m below normal, falling 14-20 cm/day. Concern over disruption to river transport and resulting economic effects."},"notes":{"es":"Evento distinto (ubicación y autoridad nacional diferentes) del evento AMZ-20260902-001 en Brasil. Verificar posible vínculo de cuenca en próximos ciclos.","pt":"Evento distinto (localização e autoridade nacional diferentes) do evento AMZ-20260902-001 no Brasil. Verificar possível vínculo de bacia em ciclos futuros.","en":"Distinct event (different location and national authority) from event AMZ-20260902-001 in Brazil. Check for possible basin-wide linkage in future cycles."},"sources":[{"label":"Inforegion (datos oficiales de SENAMHI)","url":"https://inforegion.pe/loreto-nivel-de-los-rios-huallaga-y-amazonas-siguen-descendiendo-y-aumenta-la-preocupacion-y-alcanzan-umbrales-de-alerta-roja-y-amarilla/"},{"label":"SENAMHI / Plataforma del Estado Peruano","url":"https://www.gob.pe/institucion/senamhi/noticias/1434857-senamhi-informa-sobre-niveles-de-los-principales-rios-amazonicos-de-loreto"},{"label":"GDACS","url":"Posible relación con evento GDACS 'Peru-2025' (sequía, 17 semanas): http://gdacs.org/report.aspx?eventid=1018299&episodeid=8&eventtype=DR (no confirmado como el mismo episodio)"}]},{"id":"AMZ-20260902-001","country":"Brazil","hazard":"DROUGHT","priority":"ORANGE","status":"ONGOING","basinStatus":"INSIDE","verification":"MULTIPLE_SOURCES","lat":-3.1316,"lon":-60.0224,"coordAccuracy":"APPROXIMATE","firstDetected":"2026-09-02","lastUpdated":"2026-09-10","updateCount":"3","eventDate":"2026-09-10","adminLevel1":"Amazonas","adminLevel2":"Manaus, Tabatinga, Itacoatiara, Barcelos, Fonte Boa, Beruri (multiple)","municipality":"Manaus","locality":"Estación de referencia: Porto de Manaus","title":{"es":"El Servicio Geológico de Brasil (SGB) advierte una de las sequías más severas de los últimos años en el Amazonas","pt":"Serviço Geológico do Brasil (SGB) alerta para uma das secas mais severas dos últimos anos no Amazonas","en":"Brazil's Geological Survey (SGB) warns of one of the most severe droughts in years in Amazonas"},"desc":{"es":"SGB e INPA reportan que el Rio Negro en Manaus desciende sin interrupción desde inicios de agosto, con proyecciones de un nivel mínimo 2026 entre 13-16 m, potencialmente la tercera sequía más severa registrada después de 2023 y 2024. Al 31 de agosto: Tabatinga (Solimões) 2.94 m, Manaus (Rio Negro) 24.19 m, Itacoatiara 10.06 m. Barcelos (Medio Rio Negro) rompió su rango estacional normal; afluentes de Roraima están en mínimos históricos para la época. Se cita El Niño como factor contribuyente/prolongador. ACTUALIZACIÓN (9 sep): según el 36º Boletín de Alerta Hidrológica del SGB, el nivel del Rio Negro en Manaus bajó a 22.95 m (descenso de 94 cm en la semana previa); el SGB indica que la mayoría de las estaciones monitoreadas se mantienen dentro del rango considerado normal para la época, con la excepción de la cuenca del Río Branco (Roraima), que sigue por debajo de los mínimos históricos para la temporada.","pt":"SGB e INPA relatam que o Rio Negro em Manaus vem descendo sem interrupção desde o início de agosto, com projeções de nível mínimo em 2026 entre 13-16 m, potencialmente a terceira maior seca já registrada, atrás apenas de 2023 e 2024. Em 31 de agosto: Tabatinga (Solimões) 2,94 m, Manaus (Rio Negro) 24,19 m, Itacoatiara 10,06 m. Barcelos (Médio Rio Negro) rompeu sua faixa sazonal normal; afluentes de Roraima estão nas mínimas históricas para a época. O El Niño é citado como fator contribuinte/prolongador. ATUALIZAÇÃO (9 set): segundo o 36º Boletim de Alerta Hidrológica do SGB, o nível do Rio Negro em Manaus caiu para 22,95 m (queda de 94 cm na semana anterior); o SGB indica que a maioria das estações monitoradas permanece dentro da faixa considerada normal para o período, com exceção da bacia do Rio Branco (Roraima), que segue abaixo das mínimas históricas para a temporada.","en":"SGB and INPA report the Rio Negro at Manaus has been falling without interruption since early August, with projections placing the 2026 minimum level between 13-16 m, potentially the third most severe drought on record after 2023 and 2024. As of 31 August: Tabatinga (Solimões) 2.94 m, Manaus (Rio Negro) 24.19 m, Itacoatiara 10.06 m. Barcelos (Middle Rio Negro) broke its normal seasonal range; Roraima tributaries are at record lows for this time of year. El Niño is cited as a contributing/prolonging factor. UPDATE (9 Sep): per SGB's 36th Hydrological Alert Bulletin, the Rio Negro level at Manaus fell to 22.95 m (a 94 cm drop over the preceding week); SGB states most monitored stations remain within the normal range for the period, with the exception of the Rio Branco basin (Roraima), still below historical minimums for the season."},"notes":{"es":"Tratado como evento NUEVO solo porque la base histórica estaba vacía al inicio de este ciclo; en realidad es una sequía estacional continua de varias semanas. Ciclos futuros deben actualizar este registro (UPDATE_COUNT) en vez de crear un nuevo ID por reportes adicionales de nivel del Rio Negro/Solimões. ACTUALIZACIÓN 10-sep: el nivel bajó a 22.95 m pero el SGB lo describe como dentro de rango normal estacional (salvo Río Branco/Roraima); se mantiene monitoreo por posible reclasificación de severidad en próximos ciclos.","pt":"Tratado como evento NOVO apenas porque a base histórica estava vazia no início deste ciclo; na realidade é uma seca sazonal contínua de várias semanas. Ciclos futuros devem atualizar este registro (UPDATE_COUNT) em vez de criar um novo ID para novos relatos de nível do Rio Negro/Solimões. ATUALIZAÇÃO 10-set: o nível caiu para 22,95 m, mas o SGB o descreve como dentro da faixa normal sazonal (exceto Rio Branco/Roraima); monitoramento mantido para possível reclassificação de severidade em ciclos futuros.","en":"Treated as a NEW event only because the historical database was empty at the start of this cycle; it is in fact a continuing multi-week seasonal drought. Future cycles should update this record (UPDATE_COUNT) rather than create a new ID for further Rio Negro/Solimões level reports. UPDATE 10-Sep: level fell to 22.95 m but SGB describes it as within normal seasonal range (except Rio Branco/Roraima); monitoring continues for possible severity reclassification in future cycles."},"sources":[{"label":"Serviço Geológico do Brasil (SGB), vía Portal Amazônia","url":"https://portalamazonia.com/meio-ambiente/sgb-estiagem-severa-am-2026/"},{"label":"Gazeta da Amazônia (36º Boletim SGB)","url":"https://gazetadaamazonia.com.br/09/09/2026/nivel-do-rio-negro-manaus/"},{"label":"GDACS","url":"Probable correspondencia con evento GDACS 'Brazil-2025' (sequía, 62 semanas): http://gdacs.org/report.aspx?eventid=1027448&episodeid=7&eventtype=DR (no confirmado como episodio idéntico)"}]},{"id":"AMZ-20260801-001","country":"Bolivia","hazard":"WILDFIRE","priority":"RED","status":"ONGOING","basinStatus":"PARTIALLY_INSIDE","verification":"MULTIPLE_SOURCES","lat":-14.5,"lon":-64.9,"coordAccuracy":"APPROXIMATE","firstDetected":"2026-08-01","lastUpdated":"2026-09-11","updateCount":"3","eventDate":"2026-09-11","adminLevel1":"Beni / Santa Cruz","adminLevel2":"NOT_REPORTED","municipality":"Múltiples (30 territorios indígenas en Oriente, Chaco y Amazonía)","locality":"","title":{"es":"Crisis de incendios forestales en Beni y Santa Cruz, Bolivia","pt":"Crise de incêndios florestais em Beni e Santa Cruz, Bolívia","en":"Wildfire crisis in Beni and Santa Cruz, Bolivia"},"desc":{"es":"Bolivia enfrenta una temporada de incendios forestales que ya superaba el pico de 2025 desde el 21 de julio (2,835 focos de calor, frente a 2,536 en todo 2025). El CEJIS documentó 1,122 focos de calor entre el 17 y el 31 de agosto de 2026, distribuidos en 30 de los 58 territorios indígenas de las regiones del Oriente, Chaco y Amazonía. Los departamentos de Beni y Santa Cruz concentran el 86.7% de la superficie quemada a nivel nacional. Especialistas señalan una dinámica de 'detección sin contención' por parte del Estado. ACTUALIZACIÓN (7 de septiembre): La Patria Bolivia reporta 5 incendios forestales activos en Santa Cruz, con 4,688 focos de calor acumulados en lo que va de septiembre (13 focos detectados solo el domingo). Continúa la alerta naranja departamental; las autoridades han abierto líneas de defensa estratégicas en San José, Ñuflo de Chávez y la provincia Velasco. ACTUALIZACIÓN (11 sep): La Gobernación de Santa Cruz reporta 395 focos de calor en la jornada del 10 de septiembre y 6,615 acumulados en lo que va de septiembre. Continúan 5 incendios forestales activos: Concepción, San José de Chiquitos, San Ignacio de Velasco, San Miguel de Velasco (extinguido, en observación 42 h) y el Área Natural de Manejo Integrado Otuquis, donde el fuego cruzó desde territorio brasileño hacia Bolivia (respuesta de Sernap y brigadas). Tres incendios de interfase en el área metropolitana fueron controlados por bomberos voluntarios, policía y personal de emergencia. Nota geográfica: Concepción, San José de Chiquitos, San Ignacio/San Miguel de Velasco y Otuquis se ubican en la Chiquitania/Pantanal cruceño, fuera de la cuenca amazónica propiamente dicha; Beni sigue siendo el departamento amazónico de mayor interés para este monitor.","pt":"A Bolívia enfrenta uma temporada de incêndios florestais que já superava o pico de 2025 desde 21 de julho (2.835 focos de calor, contra 2.536 em todo 2025). O CEJIS documentou 1.122 focos de calor entre 17 e 31 de agosto de 2026, distribuídos em 30 dos 58 territórios indígenas das regiões do Oriente, Chaco e Amazônia. Os departamentos de Beni e Santa Cruz concentram 86,7% da superfície queimada em nível nacional. Especialistas apontam uma dinâmica de 'detecção sem contenção' por parte do Estado. ATUALIZAÇÃO (7 de setembro): A La Patria Bolivia relata 5 incêndios florestais ativos em Santa Cruz, com 4.688 focos de calor acumulados em setembro (13 focos detectados só no domingo). O alerta laranja departamental continua vigente; as autoridades abriram linhas de defesa estratégicas em San José, Ñuflo de Chávez e na província Velasco. ATUALIZAÇÃO (11 set): A Governação de Santa Cruz relata 395 focos de calor no dia 10 de setembro e 6.615 acumulados em setembro até o momento. Continuam 5 incêndios florestais ativos: Concepción, San José de Chiquitos, San Ignacio de Velasco, San Miguel de Velasco (extinto, em observação por 42 h) e a Área Natural de Manejo Integrado de Otuquis, onde o fogo cruzou do território brasileiro para a Bolívia (resposta do Sernap e brigadas). Três incêndios de interface na região metropolitana foram controlados por bombeiros voluntários, polícia e pessoal de emergência. Nota geográfica: Concepción, San José de Chiquitos, San Ignacio/San Miguel de Velasco e Otuquis situam-se na Chiquitania/Pantanal cruceño, fora da bacia amazônica propriamente dita; Beni continua sendo o departamento amazônico de maior interesse para este monitor.","en":"Bolivia is experiencing a wildfire season that had already surpassed the 2025 peak by 21 July (2,835 heat spots, versus 2,536 for all of 2025). CEJIS documented 1,122 heat spots between 17-31 August 2026, spread across 30 of 58 indigenous territories in the Oriente, Chaco, and Amazon regions. Beni and Santa Cruz departments account for 86.7% of nationally burned area. Specialists describe a state pattern of 'detection without containment'. UPDATE (7 September): La Patria Bolivia reports 5 active wildfires in Santa Cruz, with 4,688 cumulative heat spots so far in September (13 detected on Sunday alone). The departmental orange alert remains in effect; authorities have opened strategic firebreak lines in San José, Ñuflo de Chávez, and Velasco province. UPDATE (11 Sep): The Santa Cruz departmental government reports 395 heat spots on 10 September and 6,615 cumulative for September so far. Five active wildfires continue: Concepción, San José de Chiquitos, San Ignacio de Velasco, San Miguel de Velasco (extinguished, under 42-hour observation), and the Otuquis Integrated Management Natural Area, where fire crossed from Brazilian territory into Bolivia (Sernap and brigade response). Three interface fires in the metropolitan area were controlled by volunteer firefighters, police, and emergency personnel. Geographic note: Concepción, San José de Chiquitos, San Ignacio/San Miguel de Velasco, and Otuquis lie within the Santa Cruz Chiquitania/Pantanal, outside the Amazon basin proper; Beni remains the Amazonian department of primary interest for this monitor."},"notes":{"es":"AMAZON_BASIN_STATUS marcado como PARTIALLY_INSIDE: Beni es amazónico, pero gran parte de Santa Cruz corresponde a la Chiquitania/Chaco (fuera de la cuenca). Coordenadas son un centroide departamental de Beni, no una ubicación precisa. EVENT_START_DATE (21-jul) antecede el inicio de esta ventana de monitoreo (1-ago); se registra igual por continuidad del evento. Pendiente: cruzar con datos NASA FIRMS acotados a municipios amazónicos para refinar el estado geográfico. ACTUALIZACIÓN 10-sep: cifras de focos de calor de agosto (CEJIS) y septiembre (La Patria) provienen de conteos/metodologías distintas; no sumar directamente. ACTUALIZACIÓN 11-sep: los incendios activos más recientes (Otuquis, Chiquitos, Velasco, Concepción) se ubican en la Chiquitania/Pantanal cruceño, no en la cuenca amazónica; se mantiene PARTIALLY_INSIDE, pero se recomienda para próximos ciclos intentar aislar cifras específicas de Beni (departamento amazónico) del total departamental de Santa Cruz, que es mayormente extra-amazónico. Fuego transfronterizo Brasil-Bolivia en Otuquis es un dato nuevo relevante para coordinación binacional, aunque el sitio en sí está fuera de la cuenca.","pt":"AMAZON_BASIN_STATUS marcado como PARTIALLY_INSIDE: Beni é amazônico, mas grande parte de Santa Cruz corresponde à Chiquitania/Chaco (fora da bacia). As coordenadas são um centroide departamental de Beni, não uma localização precisa. EVENT_START_DATE (21-jul) antecede o início desta janela de monitoramento (1-ago); é registrado mesmo assim por continuidade do evento. Pendente: cruzar com dados da NASA FIRMS restritos a municípios amazônicos para refinar o status geográfico. ATUALIZAÇÃO 10-set: os números de focos de calor de agosto (CEJIS) e setembro (La Patria) vêm de contagens/metodologias diferentes; não somar diretamente. ATUALIZAÇÃO 11-set: os incêndios ativos mais recentes (Otuquis, Chiquitos, Velasco, Concepción) situam-se na Chiquitania/Pantanal cruceño, não na bacia amazônica; mantém-se PARTIALLY_INSIDE, mas recomenda-se para os próximos ciclos tentar isolar números específicos de Beni (departamento amazônico) do total departamental de Santa Cruz, que é majoritariamente extra-amazônico. O fogo transfronteiriço Brasil-Bolívia em Otuquis é um dado novo relevante para coordenação binacional, embora o local em si esteja fora da bacia.","en":"AMAZON_BASIN_STATUS marked as PARTIALLY_INSIDE: Beni is Amazonian, but much of Santa Cruz falls within the Chiquitania/Chaco (outside the basin). Coordinates are a departmental centroid for Beni, not a precise location. EVENT_START_DATE (21-Jul) predates this monitoring window's start (1-Aug); recorded anyway for event continuity. Pending: cross-check against NASA FIRMS data scoped to Amazonian municipalities to refine the geographic status. UPDATE 10-Sep: August heat-spot figures (CEJIS) and September figures (La Patria) come from different counts/methodologies; do not sum directly. UPDATE 11-Sep: the most recent active fires (Otuquis, Chiquitos, Velasco, Concepción) are located in the Santa Cruz Chiquitania/Pantanal, not the Amazon basin; PARTIALLY_INSIDE is retained, but future cycles should try to isolate Beni-specific (Amazonian department) figures from the Santa Cruz departmental total, which is mostly extra-Amazonian. The cross-border Brazil-Bolivia fire at Otuquis is a relevant new data point for binational coordination, though the site itself lies outside the basin."},"sources":[{"label":"La Patria Bolivia","url":"https://lapatria.bo/enfoque-nacional/denuncia/crisis-incendios-forestales-bolivia/"},{"label":"La Patria Bolivia (actualización 7-sep)","url":"https://lapatria.bo/enfoque-nacional/gestion/incendios-forestales-santa-cruz-puntos-calor/"}]},{"id":"AMZ-20260910-001","country":"Peru","hazard":"EARTHQUAKE","priority":"GREEN","status":"OBSERVED","basinStatus":"INSIDE","verification":"MULTIPLE_SOURCES","lat":-3.91,"lon":-77.4,"coordAccuracy":"PRECISE","firstDetected":"2026-09-10","lastUpdated":"2026-09-11","updateCount":"1","eventDate":"2026-09-10","adminLevel1":"Amazonas","adminLevel2":"Condorcanqui","municipality":"Santa María de Nieva","locality":"Zona rural, aprox. 92-94 km al noreste de Santa María de Nieva","title":{"es":"Enjambre de tres sismos sacude la selva de Amazonas (Condorcanqui), Perú","pt":"Enxame de três sismos sacode a selva de Amazonas (Condorcanqui), Peru","en":"Swarm of three earthquakes shakes the Amazonas jungle (Condorcanqui), Peru"},"desc":{"es":"El Instituto Geofísico del Perú (IGP) registró tres sismos en la madrugada del 10 de septiembre de 2026 en la provincia de Condorcanqui, región Amazonas, en la selva nororiental peruana: M5.4 a las 01:42 h (15 km de profundidad, 92 km al NE de Santa María de Nieva, -3.91/-77.40, reporte IGP/CENSIS/RS 2026-0649); M4.1 a las 02:04 h (15 km de profundidad, 94 km al NE de Santa María de Nieva, -3.89/-77.40, reporte 2026-0650); y M5.0 a las 05:39 h (14-15 km de profundidad, 94 km al NE de Santa María de Nieva, -3.90/-77.39, reporte 2026-0651). La intensidad máxima percibida en Santa María de Nieva fue de grado III (leve). Defensa Civil y el Centro de Operaciones de Emergencia Nacional mantienen monitoreo; no se reportan daños, heridos ni afectados hasta el momento del reporte. ACTUALIZACIÓN (11 sep): Medios ecuatorianos (Primicias, La Prensa, El Universo, Metro Ecuador, El Diario) reportan que el enjambre fue percibido en provincias del sur y la Amazonía de Ecuador (Loja, Zamora Chinchipe, Azuay, Morona Santiago, Pastaza, Cañar y El Oro), sin daños ni heridos confirmados en territorio ecuatoriano. Se trata de la misma secuencia sísmica originada en Perú, no de un sismo independiente en Ecuador.","pt":"O Instituto Geofísico do Peru (IGP) registrou três sismos na madrugada de 10 de setembro de 2026 na província de Condorcanqui, região Amazonas, na selva nordeste peruana: M5,4 às 01h42 (15 km de profundidade, 92 km a NE de Santa María de Nieva, -3,91/-77,40, relatório IGP/CENSIS/RS 2026-0649); M4,1 às 02h04 (15 km de profundidade, 94 km a NE de Santa María de Nieva, -3,89/-77,40, relatório 2026-0650); e M5,0 às 05h39 (14-15 km de profundidade, 94 km a NE de Santa María de Nieva, -3,90/-77,39, relatório 2026-0651). A intensidade máxima percebida em Santa María de Nieva foi grau III (leve). A Defesa Civil e o Centro de Operações de Emergência Nacional mantêm monitoramento; não há relatos de danos, feridos ou afetados até o momento do relato. ATUALIZAÇÃO (11 set): Veículos equatorianos (Primicias, La Prensa, El Universo, Metro Ecuador, El Diario) relatam que o enxame foi sentido em províncias do sul e da Amazônia do Equador (Loja, Zamora Chinchipe, Azuay, Morona Santiago, Pastaza, Cañar e El Oro), sem danos ou feridos confirmados em território equatoriano. Trata-se da mesma sequência sísmica originada no Peru, não de um sismo independente no Equador.","en":"Peru's Geophysical Institute (IGP) recorded three earthquakes in the early hours of 10 September 2026 in Condorcanqui province, Amazonas region, in the northeastern Peruvian jungle: M5.4 at 01:42 local time (15 km depth, 92 km NE of Santa María de Nieva, -3.91/-77.40, report IGP/CENSIS/RS 2026-0649); M4.1 at 02:04 (15 km depth, 94 km NE of Santa María de Nieva, -3.89/-77.40, report 2026-0650); and M5.0 at 05:39 (14-15 km depth, 94 km NE of Santa María de Nieva, -3.90/-77.39, report 2026-0651). Maximum perceived intensity in Santa María de Nieva was grade III (light). Civil Defense and the National Emergency Operations Center are monitoring; no damage, injuries, or affected population have been reported as of this report. UPDATE (11 Sep): Ecuadorian outlets (Primicias, La Prensa, El Universo, Metro Ecuador, El Diario) report the swarm was felt in southern and Amazonian provinces of Ecuador (Loja, Zamora Chinchipe, Azuay, Morona Santiago, Pastaza, Cañar, and El Oro), with no confirmed damage or injuries in Ecuadorian territory. This is the same seismic sequence originating in Peru, not an independent Ecuadorian earthquake."},"notes":{"es":"No se encontró réplica del evento en USGS ni GDACS al momento del reporte (posible por magnitud/profundidad bajo umbral de reporte internacional); se toman las coordenadas y magnitudes oficiales del IGP. Verificar en próximos ciclos posibles réplicas o reportes de daño en comunidades indígenas awajún/wampis de la zona, que no suelen tener cobertura mediática inmediata. ACTUALIZACIÓN 11-sep: Reportes de percepción del sismo en seis provincias del sur de Ecuador refuerzan la magnitud reportada por el IGP mediante corroboración transfronteriza independiente, aunque continúa sin hallarse réplica en USGS/GDACS.","pt":"Não foi encontrado registro do evento no USGS nem no GDACS até o momento do relato (possivelmente por magnitude/profundidade abaixo do limiar de relato internacional); usam-se as coordenadas e magnitudes oficiais do IGP. Verificar em ciclos futuros possíveis réplicas ou relatos de danos em comunidades indígenas awajún/wampis da região, que geralmente não têm cobertura midiática imediata. ATUALIZAÇÃO 11-set: Relatos de percepção do sismo em seis províncias do sul do Equador reforçam a magnitude reportada pelo IGP por meio de corroboração transfronteiriça independente, embora ainda não se tenha encontrado registro no USGS/GDACS.","en":"No corroborating record was found on USGS or GDACS at the time of reporting (possibly below the international reporting threshold for magnitude/depth); coordinates and magnitudes are taken from IGP's official reports. Future cycles should check for aftershocks or damage reports from local Awajún/Wampis indigenous communities, which often lack immediate media coverage. UPDATE 11-Sep: Felt reports from six southern Ecuadorian provinces reinforce the magnitude reported by IGP through independent cross-border corroboration, though no matching record has yet been found on USGS/GDACS."},"sources":[{"label":"Instituto Geofísico del Perú (IGP), vía Infobae","url":"https://www.infobae.com/peru/2026/09/10/tres-sismos-sacuden-la-selva-del-peru-en-cinco-horas-igp-reporta-magnitudes-de-54-50-y-41-en-condorcanqui/"},{"label":"El Comercio (Perú)","url":"https://elcomercio.pe/peru/amazonas/amazonas-sismo-de-magnitud-50-se-registro-en-santa-maria-de-nieva-igp-temblor-ultimas-noticia/"}]},{"id":"AMZ-20260910-002","country":"Brazil","hazard":"WILDFIRE","priority":"RED","status":"ONGOING","basinStatus":"INSIDE","verification":"MULTIPLE_SOURCES","lat":-5.1214,"lon":-60.3806,"coordAccuracy":"MUNICIPALITY_APPROXIMATION","firstDetected":"2026-09-10","lastUpdated":"2026-09-11","updateCount":"1","eventDate":"2026-09-09","adminLevel1":"Amazonas","adminLevel2":"Novo Aripuanã, Manacapuru, Apuí, Autazes, Lábrea, Caapiranga (multiple)","municipality":"Novo Aripuanã","locality":"Monitoreo satelital INPE (focos de calor por municipio)","title":{"es":"Amazonas (Brasil) lidera los focos de calor del país en la primera semana de septiembre","pt":"Amazonas lidera os focos de calor do país na primeira semana de setembro","en":"Amazonas (Brazil) leads the country in heat spots during the first week of September"},"desc":{"es":"Datos del INPE (Instituto Nacional de Pesquisas Espaciais) muestran que el estado de Amazonas encabezó el conteo nacional de focos de calor en los primeros días de septiembre de 2026, con cifras reportadas de 1,167 (1-7 sep, según Portal do Caubi) a 1,224 (1-8 sep, según Rios de Notícias), muy por encima de Pará (856-1,053) y Bahía (419) en el mismo periodo. Los municipios más afectados son Novo Aripuanã (224 focos), Manacapuru (97), Apuí (96) y Autazes (87), además de Lábrea y Caapiranga entre los diez municipios con más focos del país. El fenómeno El Niño y la temporada seca son citados como factores agravantes; se anticipan lluvias por debajo del promedio para septiembre. El estado desplegó 153 nuevos brigadistas en 13 municipios (incl. Apuí, Autazes, Boca do Acre, Canutama, Humaitá, Lábrea, Manicoré, Novo Aripuanã, Tapauá, Borba, Coari, Manaquiri y Careiro Castanho) a través del Programa Floresta Sustentável. No se han reportado hasta el momento incendios activos fuera de control, evacuaciones ni víctimas. ACTUALIZACIÓN (11 sep): Se confirma incendio forestal activo desde hace 3+ días cerca del Ramal da Família (km 17 de la carretera a Novo Airão), próximo a Manacapuru, con múltiples frentes y bomberos abriendo trochas de contención (contención solo parcial). Un incendio de vegetación independiente en el barrio Coroado (Manaus, 9 sep) fue atendido por el Cuerpo de Bomberos Militar de Amazonas (CBMAM), sin víctimas ni confirmación del área quemada. El sistema de vigilancia SELVA registró calidad del aire 'mala' en Manaus el 9 de septiembre (PM2.5 entre 50 y 70 µg/m³ en varias estaciones), atribuida al humo de los incendios de Novo Aripuanã, Manacapuru, Apuí y Autazes, más incendios regionales en Rondônia y norte de Mato Grosso. Defensa Civil de Amazonas emitió alerta severa de incendio forestal para los municipios de Novo Aripuanã e Iranduba. Dado que ahora hay incendios activos confirmados (no solo indicador satelital) con impacto de salud pública en la capital estatal, se eleva ALERT_PRIORITY de ORANGE a RED.","pt":"Dados do INPE mostram que o estado do Amazonas liderou a contagem nacional de focos de calor nos primeiros dias de setembro de 2026, com números reportados de 1.167 (1-7 set, segundo o Portal do Caubi) a 1.224 (1-8 set, segundo o Rios de Notícias), muito acima do Pará (856-1.053) e da Bahia (419) no mesmo período. Os municípios mais afetados são Novo Aripuanã (224 focos), Manacapuru (97), Apuí (96) e Autazes (87), além de Lábrea e Caapiranga entre os dez municípios com mais focos do país. O El Niño e a estação seca são citados como fatores agravantes; chuvas abaixo da média são previstas para setembro. O estado mobilizou 153 novos brigadistas em 13 municípios (incl. Apuí, Autazes, Boca do Acre, Canutama, Humaitá, Lábrea, Manicoré, Novo Aripuanã, Tapauá, Borba, Coari, Manaquiri e Careiro Castanho) através do Programa Floresta Sustentável. Até o momento não há relatos de incêndios ativos fora de controle, evacuações ou vítimas. ATUALIZAÇÃO (11 set): Confirma-se incêndio florestal ativo há 3+ dias perto do Ramal da Família (km 17 da estrada para Novo Airão), próximo a Manacapuru, com múltiplas frentes e bombeiros abrindo aceiros de contenção (contenção apenas parcial). Um incêndio de vegetação independente no bairro Coroado (Manaus, 9 set) foi atendido pelo Corpo de Bombeiros Militar do Amazonas (CBMAM), sem vítimas nem confirmação da área queimada. O sistema de monitoramento SELVA registrou qualidade do ar 'ruim' em Manaus em 9 de setembro (PM2.5 entre 50 e 70 µg/m³ em várias estações), atribuída à fumaça dos incêndios de Novo Aripuanã, Manacapuru, Apuí e Autazes, além de incêndios regionais em Rondônia e norte do Mato Grosso. A Defesa Civil do Amazonas emitiu alerta severo de incêndio florestal para os municípios de Novo Aripuanã e Iranduba. Como agora há incêndios ativos confirmados (não apenas indicador via satélite) com impacto de saúde pública na capital estadual, eleva-se o ALERT_PRIORITY de ORANGE para RED.","en":"INPE (Brazil's National Institute for Space Research) data show Amazonas state led the national heat-spot count in early September 2026, with reported figures ranging from 1,167 (1-7 Sep, per Portal do Caubi) to 1,224 (1-8 Sep, per Rios de Notícias), far ahead of Pará (856-1,053) and Bahia (419) over the same period. The most affected municipalities are Novo Aripuanã (224 spots), Manacapuru (97), Apuí (96), and Autazes (87), with Lábrea and Caapiranga also among the ten Brazilian municipalities with the most heat spots. El Niño and the dry season are cited as aggravating factors; below-average rainfall is forecast for September. The state deployed 153 new firefighting brigade members across 13 municipalities (incl. Apuí, Autazes, Boca do Acre, Canutama, Humaitá, Lábrea, Manicoré, Novo Aripuanã, Tapauá, Borba, Coari, Manaquiri, and Careiro Castanho) through the Sustainable Forest Program. No out-of-control active fires, evacuations, or casualties have been reported at this time. UPDATE (11 Sep): An active forest fire burning for 3+ days near Ramal da Família (km 17 of the road to Novo Airão), close to Manacapuru, is now confirmed, with multiple fronts and firefighters cutting containment lines (only partial containment). A separate vegetation fire in the Coroado neighborhood (Manaus, 9 Sep) was handled by the Amazonas Military Fire Department (CBMAM), with no casualties and no confirmed burned area. The SELVA monitoring network recorded 'poor' air quality in Manaus on 9 September (PM2.5 between 50-70 µg/m³ at several stations), attributed to smoke from fires in Novo Aripuanã, Manacapuru, Apuí, and Autazes, plus regional fires in Rondônia and northern Mato Grosso. Amazonas Civil Defense issued a severe forest-fire alert for Novo Aripuanã and Iranduba municipalities. Because active fires are now confirmed (not just a satellite indicator) with a public-health impact on the state capital, ALERT_PRIORITY is raised from ORANGE to RED."},"notes":{"es":"Clasificado como evento de tipo Wildfire distinto del evento de Sequía AMZ-20260902-001 (mismo estado, otra amenaza). Las cifras de focos de calor de las dos fuentes difieren ligeramente por usar ventanas de días distintas (1-7 vs 1-8 sep); no sumar. A diferencia de AMZ-20260801-001 (Bolivia), no hay declaración de emergencia ni incendios activos confirmados fuera de control al momento del reporte -- se trata de un indicador de riesgo (focos de calor satelitales) mas que de incendios ya en curso confirmados sobre el terreno. Verificar en próximos ciclos si se reportan incendios activos, área quemada o impactos en comunidades ribereñas/indígenas. ACTUALIZACIÓN 11-sep: Se confirma lo que la nota anterior señalaba como pendiente de verificación: ahora hay incendios activos confirmados (Manacapuru/Novo Airão, 3+ días; Coroado en Manaus) con impacto documentado en calidad del aire de la capital estatal, no solo el indicador de focos de calor satelitales. Persisten NOT_REPORTED en área quemada exacta, evacuados y afectados; no hay declaración formal de emergencia estatal/federal aún, solo alerta de Defensa Civil para 2 municipios.","pt":"Classificado como evento do tipo Wildfire distinto do evento de Seca AMZ-20260902-001 (mesmo estado, outra ameaça). Os números de focos de calor das duas fontes diferem levemente por usarem janelas de dias distintas (1-7 vs 1-8 set); não somar. Diferentemente de AMZ-20260801-001 (Bolívia), não há declaração de emergência nem incêndios ativos confirmados fora de controle até o momento do relato -- trata-se de um indicador de risco (focos de calor via satélite) mais do que incêndios já em curso confirmados em campo. Verificar em ciclos futuros se há relatos de incêndios ativos, área queimada ou impactos em comunidades ribeirinhas/indígenas. ATUALIZAÇÃO 11-set: Confirma-se o que a nota anterior apontava como pendente de verificação: agora há incêndios ativos confirmados (Manacapuru/Novo Airão, 3+ dias; Coroado em Manaus) com impacto documentado na qualidade do ar da capital estadual, não apenas o indicador de focos de calor via satélite. Persistem NOT_REPORTED quanto à área queimada exata, evacuados e afetados; não há declaração formal de emergência estadual/federal ainda, apenas alerta da Defesa Civil para 2 municípios.","en":"Classified as a Wildfire-type event distinct from the Drought event AMZ-20260902-001 (same state, different hazard). Heat-spot figures from the two sources differ slightly because they use different day windows (1-7 vs 1-8 Sep); do not sum. Unlike AMZ-20260801-001 (Bolivia), no emergency has been declared and no confirmed out-of-control active fires have been reported at time of writing -- this is a risk indicator (satellite heat spots) rather than confirmed active fires on the ground. Future cycles should check for reports of active fires, burned area, or impacts on riverine/indigenous communities. UPDATE 11-Sep: This confirms what the previous note flagged as pending verification: active fires are now confirmed (Manacapuru/Novo Airão, 3+ days; Coroado in Manaus) with documented impact on the state capital's air quality, not just the satellite heat-spot indicator. Exact burned area, evacuees, and affected population remain NOT_REPORTED; no formal state/federal emergency declaration yet, only a Civil Defense alert for 2 municipalities."},"sources":[{"label":"Rios de Notícias (dados INPE)","url":"https://www.riosdenoticias.com.br/amazonas-lidera-ranking-de-focos-de-queimadas-nos-primeiros-dias-de-setembro-aponta-inpe/"},{"label":"Portal do Caubi (dados INPE)","url":"https://www.portaldocaubi.com.br/amazonas-lidera-focos-de-calor-no-brasil-na-primeira-semana-de-setembro/"}]},{"id":"AMZ-20260911-001","country":"Colombia","hazard":"DROUGHT","priority":"GREEN","status":"ONGOING","basinStatus":"INSIDE","verification":"SINGLE_SOURCE","lat":-4.2153,"lon":-69.9406,"coordAccuracy":"MUNICIPALITY_APPROXIMATION","firstDetected":"2026-09-11","lastUpdated":"2026-09-11","updateCount":"0","eventDate":"2026-09-11","adminLevel1":"Amazonas","adminLevel2":"NOT_REPORTED","municipality":"Leticia","locality":"","title":{"es":"Descenso del río Amazonas genera preocupación por el abastecimiento de agua en Leticia, Colombia","pt":"Queda do rio Amazonas gera preocupação com o abastecimento de água em Letícia, Colômbia","en":"Falling Amazon River raises water-supply concerns in Leticia, Colombia"},"desc":{"es":"Según un reporte de Asocapitales/UNGRD citado por Infobae Colombia (11 de septiembre de 2026), el nivel del río Amazonas descendió en Leticia (departamento de Amazonas), lo que \"estaría comprometiendo\" el abastecimiento de agua y la producción agrícola de la región. La mención surge en el contexto de un informe sobre ocho capitales colombianas en alerta roja por desabastecimiento de agua e incendios ante el fenómeno de El Niño (Leticia no figura entre esas ocho ciudades). El artículo no aporta cifras de nivel del río, porcentaje de descenso, fecha de inicio, ni cita una fuente hidrológica primaria (IDEAM o Corpoamazonía). El fenómeno es consistente con la sequía hidrológica regional ya registrada en Loreto, Perú (AMZ-20260908-001) y en el Rio Negro/Solimões, Brasil (AMZ-20260902-001), pero se registra como evento distinto por tratarse de un país y una autoridad diferentes.","pt":"Segundo um relatório da Asocapitales/UNGRD citado pela Infobae Colômbia (11 de setembro de 2026), o nível do rio Amazonas caiu em Letícia (departamento de Amazonas), o que \"estaria comprometendo\" o abastecimento de água e a produção agrícola da região. A menção surge no contexto de um relatório sobre oito capitais colombianas em alerta vermelho por desabastecimento de água e incêndios diante do fenômeno El Niño (Letícia não figura entre essas oito cidades). O artigo não traz números de nível do rio, percentual de queda, data de início, nem cita uma fonte hidrológica primária (IDEAM ou Corpoamazonía). O fenômeno é consistente com a seca hidrológica regional já registrada em Loreto, Peru (AMZ-20260908-001) e no Rio Negro/Solimões, Brasil (AMZ-20260902-001), mas é registrado como evento distinto por se tratar de um país e uma autoridade diferentes.","en":"According to an Asocapitales/UNGRD report cited by Infobae Colombia (11 September 2026), the Amazon River's level has fallen at Leticia (Amazonas department), which \"would be compromising\" the region's water supply and agricultural production. The mention appears in the context of a report on eight Colombian capital cities under red alert for water shortages and fires amid El Niño (Leticia is not among those eight cities). The article gives no river-level figures, percentage decline, start date, or primary hydrological source (IDEAM or Corpoamazonía). The phenomenon is consistent with the regional hydrological drought already recorded in Loreto, Peru (AMZ-20260908-001) and the Rio Negro/Solimões, Brazil (AMZ-20260902-001), but is logged as a distinct event since it involves a different country and authority."},"notes":{"es":"Fuente única y sin cifras cuantitativas, fecha específica de inicio del descenso, ni estación hidrológica citada; las coordenadas corresponden al centro urbano de Leticia (ubicación pública conocida), no a una estación de medición precisa. Se recomienda verificar con IDEAM/Corpoamazonía y buscar reportes dedicados (no solo una mención de una frase) en próximos ciclos antes de escalar la prioridad o cuantificar impactos. Posible vínculo con la sequía hidrológica regional de Loreto (Perú) y Rio Negro/Solimões (Brasil); no se combina en un único registro por tratarse de países y autoridades distintas.","pt":"Fonte única e sem números quantitativos, data específica de início da queda, nem estação hidrológica citada; as coordenadas correspondem ao centro urbano de Letícia (localização pública conhecida), não a uma estação de medição precisa. Recomenda-se verificar com IDEAM/Corpoamazonía e buscar relatórios dedicados (não apenas uma menção de uma frase) em próximos ciclos antes de escalar a prioridade ou quantificar impactos. Possível vínculo com a seca hidrológica regional de Loreto (Peru) e Rio Negro/Solimões (Brasil); não é combinado em um único registro por se tratar de países e autoridades distintas.","en":"Single source with no quantitative figures, no specific start date for the decline, and no cited hydrological gauge; coordinates correspond to Leticia's urban center (a known public location), not a precise measurement station. Verification with IDEAM/Corpoamazonía and a search for dedicated reports (beyond a one-sentence mention) is recommended in future cycles before escalating priority or quantifying impacts. Possibly linked to the regional hydrological drought in Loreto (Peru) and the Rio Negro/Solimões (Brazil); not merged into a single record since it involves different countries and authorities."},"sources":[{"label":"Infobae Colombia (citando Asocapitales / UNGRD)","url":"https://www.infobae.com/colombia/2026/09/11/ocho-capitales-estan-en-alerta-roja-por-desabastecimiento-de-agua-e-incendios-ante-el-nino-segun-asocapitales/"}]},{"id":"AMZ-20260911-002","country":"Ecuador","hazard":"EXTREME_RAIN","priority":"GREEN","status":"OBSERVED","basinStatus":"INSIDE","verification":"SINGLE_SOURCE","lat":-0.0892,"lon":-76.8869,"coordAccuracy":"APPROXIMATE","firstDetected":"2026-09-11","lastUpdated":"2026-09-11","updateCount":"0","eventDate":"2026-09-09","adminLevel1":"Sucumbíos, Orellana, Pastaza, Morona Santiago (alerta alta); Napo, Zamora Chinchipe (alerta parcial)","adminLevel2":"NOT_REPORTED","municipality":"Lago Agrio (Nueva Loja)","locality":"","title":{"es":"INAMHI emite alerta por lluvias intensas en provincias amazónicas de Ecuador","pt":"INAMHI emite alerta por chuvas intensas em províncias amazônicas do Equador","en":"INAMHI issues heavy rain alert for Ecuador's Amazon provinces"},"desc":{"es":"El Instituto Nacional de Meteorología e Hidrología (INAMHI) de Ecuador emitió una alerta por lluvias de intensidad media a alta para la noche del 5 de septiembre hasta la mañana del 9 de septiembre de 2026, con los niveles de alerta más altos en las provincias amazónicas de Sucumbíos, Orellana, Pastaza y Morona Santiago, y alertas parciales en Napo y Zamora Chinchipe. El aviso señaló riesgo de acumulación de agua en viviendas, negocios y vías, deterioro de las condiciones viales por agua estancada, caída de árboles y baja visibilidad, tormentas eléctricas fuertes con ráfagas de viento, y posible crecida de cuerpos de agua en ciertos sectores. No se encontraron, al momento de este reporte, notas de prensa o boletines del Servicio Nacional de Gestión de Riesgos y Emergencias (SNGR) que confirmen inundaciones, daños o personas afectadas específicamente derivadas de este episodio de lluvias; el registro se basa únicamente en el aviso preventivo de INAMHI.","pt":"O Instituto Nacional de Meteorologia e Hidrologia (INAMHI) do Equador emitiu um alerta de chuvas de intensidade média a alta para a noite de 5 de setembro até a manhã de 9 de setembro de 2026, com os níveis de alerta mais altos nas províncias amazônicas de Sucumbíos, Orellana, Pastaza e Morona Santiago, e alertas parciais em Napo e Zamora Chinchipe. O aviso apontou risco de acúmulo de água em residências, comércios e vias, deterioração das condições viárias por água parada, queda de árvores e baixa visibilidade, tempestades elétricas fortes com rajadas de vento, e possível elevação de corpos d'água em alguns setores. Não foram encontradas, até o momento deste relato, notícias ou boletins do Serviço Nacional de Gestão de Riscos e Emergências (SNGR) confirmando inundações, danos ou pessoas afetadas especificamente decorrentes deste episódio de chuvas; o registro baseia-se apenas no aviso preventivo do INAMHI.","en":"Ecuador's National Institute of Meteorology and Hydrology (INAMHI) issued a medium-to-high intensity rain alert for the night of September 5 through the morning of September 9, 2026, with the highest alert levels in the Amazon provinces of Sucumbíos, Orellana, Pastaza, and Morona Santiago, and partial alerts for Napo and Zamora Chinchipe. The advisory warned of water accumulation in homes, businesses, and roads, deteriorated road conditions from standing water, fallen trees and reduced visibility, strong electrical storms with powerful wind gusts, and possible rising water bodies in some sectors. No press releases or bulletins from Ecuador's National Risk and Emergency Management Service (SNGR) confirming flooding, damage, or specifically affected populations from this rain episode were found at the time of this report; the record is based solely on INAMHI's preventive advisory."},"notes":{"es":"Ecuador no tenía eventos previamente registrados en este monitor. Este registro corresponde a un aviso preventivo de INAMHI, no a un evento con daños confirmados; se marca CONFIDENCE bajo y VERIFICATION_STATUS de fuente única. Las coordenadas corresponden al centro urbano de Lago Agrio/Nueva Loja (Sucumbíos), la provincia citada con mayor alerta, no a una estación de medición ni a un punto de impacto confirmado -- el aviso también cubrió Orellana, Pastaza, Morona Santiago (alerta alta) y Napo, Zamora Chinchipe (alerta parcial). Se recomienda para próximos ciclos revisar boletines del SNGR (SitRep por lluvias) para confirmar si hubo inundaciones o daños reales asociados a este episodio.","pt":"O Equador não tinha eventos previamente registrados neste monitor. Este registro corresponde a um aviso preventivo do INAMHI, não a um evento com danos confirmados; marca-se CONFIDENCE baixo e VERIFICATION_STATUS de fonte única. As coordenadas correspondem ao centro urbano de Lago Agrio/Nueva Loja (Sucumbíos), a província citada com maior alerta, não a uma estação de medição nem a um ponto de impacto confirmado -- o aviso também cobriu Orellana, Pastaza, Morona Santiago (alerta alto) e Napo, Zamora Chinchipe (alerta parcial). Recomenda-se para os próximos ciclos revisar boletins do SNGR (SitRep por chuvas) para confirmar se houve inundações ou danos reais associados a este episódio.","en":"Ecuador had no previously recorded events in this monitor. This record corresponds to a preventive INAMHI advisory, not an event with confirmed damage; CONFIDENCE is marked low and VERIFICATION_STATUS as single source. Coordinates correspond to the urban center of Lago Agrio/Nueva Loja (Sucumbíos), the province cited with the highest alert level, not a measurement station or a confirmed impact point -- the advisory also covered Orellana, Pastaza, Morona Santiago (high alert) and Napo, Zamora Chinchipe (partial alert). Future cycles should check SNGR bulletins (rain SitReps) to confirm whether actual flooding or damage occurred from this episode."},"sources":[{"label":"Primicias (Ecuador)","url":"https://www.primicias.ec/sociedad/lluvias-costa-amazonia-sucumbios-losrios-guayas-inamhi-septiembre2026-131934/"}]},{"id":"AMZ-20260911-003","country":"Brazil","hazard":"DROUGHT","priority":"ORANGE","status":"ONGOING","basinStatus":"INSIDE","verification":"MULTIPLE_SOURCES","lat":-2.8235,"lon":-60.6758,"coordAccuracy":"MUNICIPALITY_APPROXIMATION","firstDetected":"2026-09-11","lastUpdated":"2026-09-11","updateCount":"0","eventDate":"2026-09-02","adminLevel1":"Roraima","adminLevel2":"NOT_REPORTED","municipality":"Boa Vista / Caracaraí","locality":"NOT_REPORTED","title":{"es":"Roraima decreta emergencia por sequía severa ante El Niño","pt":"Roraima decreta emergência por seca severa diante do El Niño","en":"Roraima declares emergency over severe drought amid El Niño"},"desc":{"es":"El gobierno del estado de Roraima (Brasil) decretó el 2 de septiembre estado de emergencia (Nivel II) por 180 días ante una estiagem severa agravada por El Niño. El río Branco registró niveles críticos: 1,38 m en Boa Vista (70,3% por debajo del promedio histórico) y 2,05 m en Caracaraí (62,7% por debajo de lo normal). Roraima acumuló 87 focos de calor en agosto, superando el récord anterior de 78 (agosto de 2023).","pt":"O governo do estado de Roraima (Brasil) decretou em 2 de setembro estado de emergência (Nível II) por 180 dias diante de uma estiagem severa agravada pelo El Niño. O rio Branco registrou níveis críticos: 1,38 m em Boa Vista (70,3% abaixo da média histórica) e 2,05 m em Caracaraí (62,7% abaixo do normal). Roraima acumulou 87 focos de calor em agosto, superando o recorde anterior de 78 (agosto de 2023).","en":"The government of Roraima state (Brazil) decreed a state of emergency (Level II) on September 2 for 180 days amid severe drought worsened by El Niño. The Branco River reached critical levels: 1.38 m in Boa Vista (70.3% below the historical average) and 2.05 m in Caracaraí (62.7% below normal). Roraima recorded 87 heat spots in August, surpassing the previous record of 78 (August 2023)."},"notes":{"es":"Evento nuevo en este ciclo. Roraima forma parte de la cuenca amazónica (río Branco → río Negro → Amazonas). Monitorear evolución de la estiagem y del decreto de emergencia.","pt":"Evento novo neste ciclo. Roraima faz parte da bacia amazônica (rio Branco → rio Negro → Amazonas). Monitorar a evolução da estiagem e do decreto de emergência.","en":"New event this cycle. Roraima is part of the Amazon basin (Branco River → Negro River → Amazon). Monitor the evolution of the drought and the state of emergency decree."},"sources":[{"label":"Roraima1","url":"https://roraima1.com.br/roraima-decreta-emergencia-por-estiagem-apos-rios-atingirem-niveis-criticos-e-focos-de-calor-baterem-recorde/"},{"label":"ac24horas","url":"https://ac24horas.com/2026/09/03/estiagem-se-agrava-e-roraima-decreta-emergencia-para-enfrentar-impactos-do-el-nino/"}]},{"id":"AMZ-20260911-004","country":"Peru","hazard":"LANDSLIDE","priority":"ORANGE","status":"FORECAST","basinStatus":"PARTIALLY_INSIDE","verification":"MULTIPLE_SOURCES","lat":-6.0333,"lon":-76.9667,"coordAccuracy":"ADMINISTRATIVE_APPROXIMATION (punto representativo, San Martín)","firstDetected":"2026-09-11","lastUpdated":"2026-09-11","updateCount":"0","eventDate":"2026-09-13","adminLevel1":"San Martín (mayor riesgo); también Loreto, Amazonas, Ucayali y regiones andinas (Ayacucho, Cajamarca, Cusco, Huánuco, Junín, Pasco, Puno)","adminLevel2":"NOT_REPORTED","municipality":"Múltiples (160 distritos en 11 departamentos)","locality":"NOT_REPORTED","title":{"es":"SENAMHI e INDECI alertan riesgo de huaicos y deslizamientos en 160 distritos del Perú (13-14 sept.)","pt":"SENAMHI e INDECI alertam risco de deslizamentos e corridas de detritos em 160 distritos do Peru (13-14 set.)","en":"SENAMHI and INDECI warn of landslide and debris-flow risk in 160 Peruvian districts (Sept 13-14)"},"desc":{"es":"El SENAMHI (aviso meteorológico N.° 358) e INDECI emitieron una alerta por lluvias de ligera a moderada intensidad previstas entre el 13 y 14 de septiembre en 160 distritos de 11 departamentos, incluyendo zonas de la cuenca amazónica (Loreto, Amazonas, San Martín, Ucayali) además de regiones andinas fuera de la cuenca (Ayacucho, Cajamarca, Cusco, Huánuco, Junín, Pasco, Puno). San Martín concentra la mayor cantidad de distritos en riesgo muy alto (16). Se prevén deslizamientos, huaicos y movimientos en masa por saturación del suelo e inestabilidad de laderas.","pt":"O SENAMHI (aviso meteorológico n.º 358) e o INDECI emitiram um alerta por chuvas de leve a moderada intensidade previstas entre 13 e 14 de setembro em 160 distritos de 11 departamentos, incluindo áreas da bacia amazônica (Loreto, Amazonas, San Martín, Ucayali) além de regiões andinas fora da bacia (Ayacucho, Cajamarca, Cusco, Huánuco, Junín, Pasco, Puno). San Martín concentra o maior número de distritos em risco muito alto (16). Preveem-se deslizamentos, corridas de detritos (huaicos) e movimentos de massa por saturação do solo e instabilidade de encostas.","en":"Peru's SENAMHI (weather advisory No. 358) and INDECI issued an alert for light-to-moderate rainfall forecast between September 13-14 across 160 districts in 11 departments, including Amazon basin areas (Loreto, Amazonas, San Martín, Ucayali) as well as Andean regions outside the basin (Ayacucho, Cajamarca, Cusco, Huánuco, Junín, Pasco, Puno). San Martín has the largest number of districts at very-high risk (16). Landslides, debris flows (huaicos), and mass movements are anticipated due to soil saturation and slope instability."},"notes":{"es":"Alerta de pronóstico (evento aún no observado); cubre departamentos dentro y fuera de la cuenca amazónica, por lo que se marca PARTIALLY_INSIDE. Coordenadas representan un punto administrativo (San Martín), no una ubicación puntual del peligro. Monitorear el 13-14 de septiembre para confirmar impactos reales.","pt":"Alerta de previsão (evento ainda não observado); abrange departamentos dentro e fora da bacia amazônica, por isso é marcado como PARTIALLY_INSIDE. As coordenadas representam um ponto administrativo (San Martín), não uma localização pontual do perigo. Monitorar em 13-14 de setembro para confirmar impactos reais.","en":"Forecast alert (event not yet observed); covers departments both inside and outside the Amazon basin, hence marked PARTIALLY_INSIDE. Coordinates represent an administrative point (San Martín), not a specific hazard location. Monitor September 13-14 to confirm real impacts."},"sources":[{"label":"INDECI / SENAMHI (vía Infobae)","url":"https://www.infobae.com/peru/2026/09/11/lista-de-160-distritos-en-riesgo-por-lluvias-se-preve-deslizamientos-huaicos-y-movimientos-en-masa/"},{"label":"El Popular","url":"https://elpopular.pe/actualidad/2026/09/11/senamhi-advierte-lluvias-extremas-desde-el-13-de-septiembre-160-distritos-bajo-riesgo-de-huaicos-y-deslizamientos-886215"}]}];

function presentHazards(){
  var set = {};
  EVENTS.forEach(function(e){ set[e.hazard] = true; });
  var ordered = HAZARD_ORDER.filter(function(h){ return set[h]; });
  Object.keys(set).forEach(function(h){ if (ordered.indexOf(h) === -1) ordered.push(h); });
  return ordered;
}
function presentCountries(){
  var set = {};
  EVENTS.forEach(function(e){ set[e.country] = true; });
  return Object.keys(set).sort();
}

}
function getFiltered(){

}

  presentHazards().forEach(function(hz){
    var item = document.createElement('span');
    item.style.display = 'inline-flex'; item.style.alignItems = 'center'; item.style.gap='4px';
    item.style.background = 'var(--3is-aqua-tint)'; item.style.padding = '3px 8px'; item.style.borderRadius = '999px'; item.style.color='var(--3is-teal-deep)';
    item.innerHTML = iconSvg(hz,13) + '<span>' + hazardLabel(hz) + '</span>';
    shapeBlock.appendChild(item);
  });
  var colorBlock = document.createElement('div');
  colorBlock.style.display = 'flex'; colorBlock.style.flexWrap='wrap'; colorBlock.style.gap='10px'; colorBlock.style.alignItems='center';
  var colorLabel = document.createElement('span');
  colorLabel.textContent = t('legendColor') + ':';
  colorLabel.style.fontWeight = '600';
  colorBlock.appendChild(colorLabel);
  ['RED','ORANGE','GREEN'].forEach(function(p){
    var item = document.createElement('span');
    item.style.display='inline-flex'; item.style.alignItems='center'; item.style.gap='4px';
    item.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+PRIORITY_COLOR[p]+'"></span><span>'+t(p)+'</span>';
    colorBlock.appendChild(item);
  });
  wrap.appendChild(shapeBlock);
  wrap.appendChild(colorBlock);
}

function renderStats(filtered){
  var wrap = document.getElementById('stats');
  wrap.innerHTML = '';
  var total = filtered.length;
  var red = filtered.filter(function(e){ return e.priority === 'RED'; }).length;
  var countries = {};
  filtered.forEach(function(e){ countries[e.country] = true; });
  var cards = [
    [t('total'), total],
    [t('red'), red],
    [t('countries'), Object.keys(countries).length]
  ];
  cards.forEach(function(c){
    var card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = '<p>'+c[0]+'</p><p>'+c[1]+'</p>';
    wrap.appendChild(card);
  });
}

function eventPopupHtml(e){
  var srcHtml = (e.sources || []).map(function(s){
    return '<a href="'+s.url+'" target="_blank" style="color:var(--3is-cyan)">'+ (s.label||t('source')) +' ↗</a>';
  }).join(' · ');
  var title = (e.title && e.title[currentLang]) || e.id;
  var desc = (e.desc && e.desc[currentLang]) || '';
  return '<div style="max-width:260px;font-size:13px">'+
    '<p style="margin:0 0 4px;font-weight:700;color:var(--3is-navy)">'+title+'</p>'+
    '<p style="margin:0 0 6px;color:var(--text-muted)">'+countryLabel(e.country)+' · '+hazardLabel(e.hazard)+' · <span style="color:'+PRIORITY_COLOR[e.priority]+';font-weight:600">'+t(e.priority)+'</span></p>'+
    '<p style="margin:0 0 6px">'+desc+'</p>'+
    '<p style="margin:0 0 4px;color:var(--text-muted)">'+t('updated')+': '+e.lastUpdated+'</p>'+
    (srcHtml ? '<p style="margin:0">'+t('source')+': '+srcHtml+'</p>' : '') +
  '</div>';
}

function renderMarkers(filtered){
  if (!newsLayer) return;
  newsLayer.clearLayers();
  filtered.forEach(function(e){
    if (typeof e.lat !== 'number' || typeof e.lon !== 'number' || isNaN(e.lat) || isNaN(e.lon)) return;
    var color = PRIORITY_COLOR[e.priority] || PRIORITY_COLOR.GREEN;
    var html = '<div style="background:'+color+';color:#fff;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff">'+
      '<span style="transform:rotate(-45deg);display:flex">'+iconSvg(e.hazard,14)+'</span></div>';
    var icon = L.divIcon({ html: html, className: '', iconSize: [26,26], iconAnchor: [13,26], popupAnchor: [0,-24] });
    var marker = L.marker([e.lat, e.lon], { icon: icon });
    marker.bindPopup(eventPopupHtml(e));
    marker.addTo(newsLayer);
  });
}

function renderFirmsMarkers(){
  if (!firmsLayer) return;
  firmsLayer.clearLayers();
  (typeof FIRMS_HOTSPOTS !== 'undefined' ? FIRMS_HOTSPOTS : []).forEach(function(p){
    var color = FIRMS_COLOR[p.confidence] || FIRMS_COLOR.nominal;
    var m = L.circleMarker([p.lat, p.lon], {
      radius: 3.5, color: color, weight: 1, fillColor: color, fillOpacity: 0.75
    });
    m.bindPopup('<div style="font-size:12px"><b>'+t('layerFirms')+'</b><br>'+p.satellite+' · '+p.date+' · '+p.confidence+'</div>');
    m.addTo(firmsLayer);
  });
}

function renderList(filtered){
  var wrap = document.getElementById('list');
  wrap.innerHTML = '';
  var byCountry = {};
  filtered.forEach(function(e){
    (byCountry[e.country] = byCountry[e.country] || []).push(e);
  });
  Object.keys(byCountry).sort().forEach(function(c){
    var h = document.createElement('p');
    h.style.fontWeight = '800'; h.style.fontSize = '15px'; h.style.color = 'var(--3is-navy)'; h.style.margin = '14px 0 6px';
    h.textContent = countryLabel(c);
    wrap.appendChild(h);
    byCountry[c].sort(function(a,b){ return (b.eventDate||'').localeCompare(a.eventDate||''); }).forEach(function(e){
      var card = document.createElement('div');
      card.style.border = '1px solid var(--3is-gray)'; card.style.borderRadius = 'var(--radius)'; card.style.padding = '10px 12px'; card.style.marginBottom = '8px'; card.style.background = '#fff'; card.style.cursor = 'pointer';
      var title = (e.title && e.title[currentLang]) || e.id;
      var srcHtml = (e.sources||[]).map(function(s){ return '<a href="'+s.url+'" target="_blank" style="color:var(--3is-cyan)" onclick="event.stopPropagation()">'+(s.label||t('source'))+' ↗</a>'; }).join(' · ');
      card.innerHTML = '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'+
        '<span style="width:9px;height:9px;border-radius:50%;background:'+(PRIORITY_COLOR[e.priority]||PRIORITY_COLOR.GREEN)+';flex:none"></span>'+
        '<span style="color:var(--3is-teal-deep);display:inline-flex">'+iconSvg(e.hazard,13)+'</span>'+
        '<span style="font-size:12px;color:var(--text-muted)">'+hazardLabel(e.hazard)+' · '+ (e.eventDate||e.firstDetected) +'</span>'+
        '</div>'+
        '<p style="margin:0 0 4px;font-size:13px;font-weight:600;color:var(--3is-navy)">'+title+'</p>'+
        (srcHtml ? '<p style="margin:0;font-size:11px">'+srcHtml+'</p>' : '');
      card.onclick = function(){
        if (typeof e.lat === 'number' && typeof e.lon === 'number' && map) {
          map.setView([e.lat, e.lon], 8);
          L.popup().setLatLng([e.lat, e.lon]).setContent(eventPopupHtml(e)).openOn(map);
        }
      };
      wrap.appendChild(card);
    });
  });
}

function applyI18nText(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    var val = t(key);
    if (key === 'dataSourcesHTML') { el.innerHTML = val; }
    else { el.textContent = val; }
  });
  var dsEl = document.getElementById('dataSources');
  if (dsEl) dsEl.innerHTML = t('dataSourcesHTML');
  var infoEl = document.getElementById('infoPanel');
  if (infoEl) infoEl.innerHTML = t('infoHTML');
  var luEl = document.getElementById('lastUpdated');
  if (luEl) luEl.textContent = t('lastUpdated') + ': ' + LAST_UPDATED;
  if (layersControl) {
    layersControl.remove();
    buildLayersControl();
  }
}

function renderAll(){
  var filtered = getFiltered();
  renderCountryFilters();
  renderHazardFilters();
  renderLegend();
  renderStats(filtered);
  renderMarkers(filtered);
  renderList(filtered);
}

function buildLayersControl(){
  var baseLayers = {};
  baseLayers['OpenStreetMap'] = window.__osmLayer;
  baseLayers['Satellite'] = window.__satLayer;
  var overlays = {};
  overlays[t('borders')] = window.__bordersLayer;
  overlays[t('layerNews')] = newsLayer;
  overlays[t('layerFirms')] = firmsLayer;
  layersControl = L.control.layers(baseLayers, overlays, { position: 'topright', collapsed: true }).addTo(map);
}

function initMap(){
  map = L.map('map', { scrollWheelZoom: true }).setView([-6, -66], 4);

  window.__osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 18
  }).addTo(map);

  window.__satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri World Imagery', maxZoom: 18
  });

  window.__bordersLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Boundaries & Places', maxZoom: 18, opacity: 0.9
  });

  newsLayer = L.layerGroup().addTo(map);
  firmsLayer = L.layerGroup().addTo(map);

  buildLayersControl();
}

function wireControls(){
  document.getElementById('lang').addEventListener('change', function(e){
    currentLang = e.target.value;
    applyI18nText();
    renderAll();
  });
  document.getElementById('infoBtn').addEventListener('click', function(){
    var p = document.getElementById('infoPanel');
    p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';
  });
  document.getElementById('dateFrom').addEventListener('change', function(e){ dateFrom = e.target.value || null; renderAll(); });
  document.getElementById('dateTo').addEventListener('change', function(e){ dateTo = e.target.value || null; renderAll(); });
  document.getElementById('dateClear').addEventListener('click', function(){
    dateFrom = null; dateTo = null;
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    renderAll();
  });
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('lang').value = currentLang;
  applyI18nText();
  initMap();
  wireControls();
  renderFirmsMarkers();
  renderAll();
});
</script>
</body>
</html>
