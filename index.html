<title>Mapa de riesgos — Cuenca amazónica</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --3is-navy:#063B6D; --3is-teal-deep:#135879; --3is-cyan:#207685;
    --3is-aqua:#41C0A6; --3is-teal:#4CDBB0; --3is-gray:#E6E6E6;
    --3is-aqua-tint:#D4F5EE; --3is-peach:#FFDAB9; --3is-coral:#FD956F; --3is-mustard:#F4B942;
    --radius: 10px;
    --border: var(--3is-gray);
    --border-strong: var(--3is-cyan);
    --text-primary: #000000;
    --text-secondary: var(--3is-teal-deep);
    --text-muted: #6b7583;
    --surface-1: var(--3is-gray);
    --surface-2: #ffffff;
    --font-sans: 'Montserrat', sans-serif;
    --fill-primary: var(--3is-teal);
    --on-primary: var(--3is-navy);
  }
  #av-3is-root, #av-3is-root * { font-family: var(--font-sans); box-sizing: border-box; }
  #av-3is-root { background: #ffffff; border: 1px solid var(--3is-gray); border-radius: 16px; overflow: hidden; }
  #av-3is-body { padding: 1.5rem; }
  #map { height: 420px; border-radius: var(--radius); z-index: 0; }
  select, input[type=checkbox] { font-family: var(--font-sans); }
  select { border: 1px solid var(--3is-cyan); border-radius: var(--radius); padding: 5px 10px; font-size: 13px; color: var(--3is-teal-deep); background: #fff; }
  button#infoBtn { border: 1px solid var(--3is-cyan); border-radius: var(--radius); padding: 5px 12px; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  .chip { font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--3is-cyan); background: transparent; color: var(--3is-teal-deep); cursor: pointer; }
  .chip.active { background: var(--3is-teal); color: var(--3is-navy); border-color: var(--3is-teal); font-weight: 700; }
  .leaflet-popup-content-wrapper { background: #fff; color: var(--text-primary); border-radius: 8px; font-family: var(--font-sans); border: 1px solid var(--3is-gray); }
  .leaflet-popup-tip { background: #fff; }
  .stat-card { background: var(--3is-gray); border-radius: var(--radius); padding: 1rem; }
  .stat-card p:first-child { font-size: 13px; color: var(--3is-teal-deep); margin: 0; font-weight: 500; }
  .stat-card p:last-child { font-size: 24px; font-weight: 800; margin: 4px 0 0; color: var(--3is-navy); }
  .brand-divider { height: 6px; background: linear-gradient(90deg, var(--3is-aqua) 0%, var(--3is-cyan) 55%, var(--3is-navy) 100%); }
  .dot-field { position:absolute; inset:0; opacity:0.15;
    background-image: radial-gradient(circle, #ffffff 1px, transparent 1.4px);
    background-size: 14px 14px; }
</style>

    bordersNote:"Los datos geográficos, nombres y límites políticos y administrativos utilizados en este mapa no implican aceptación oficial por parte de 3iS.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Niveles de alerta</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Rojo</span>: evento mayor o de rápida escalada, con consecuencias humanitarias, ambientales, agrícolas o de medios de vida significativas.</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Naranja</span>: evento significativo que requiere monitoreo y es potencialmente relevante para acción humanitaria o anticipatoria.</p>
      <p style="margin:0 0 12px"><span style="color:#639922">● Verde</span>: evento relevante de impacto limitado, o en etapa temprana, que requiere monitoreo.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Metodología y fuentes</b></p>
      <p style="margin:0 0 4px">Jerarquía de fuentes: Nivel 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, servicios meteorológicos/geológicos nacionales) → Nivel 2 (WFP, IFRC, Cruz Roja) → Nivel 3 (medios acreditados) → Nivel 4 (redes sociales, solo como pista, nunca confirmación única).</p>
      <p style="margin:0 0 4px">Cada evento requiere verificación cruzada cuando es posible (idealmente fuente oficial + humanitaria, o fuente oficial + medio acreditado). Si solo hay una fuente confiable: <code>SINGLE_SOURCE</code>. Si las fuentes se contradicen: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0">Coordenadas en WGS84 (EPSG:4326). La cobertura geográfica se limita a Bolivia, Brasil, Colombia, Ecuador, Perú y Venezuela; un evento dentro de un país elegible no se incluye automáticamente si ocurre fuera de la cuenca amazónica.</p>
      <p style="margin:8px 0 0"><a href="https://gdacs.org/" target="_blank" style="color:var(--3is-cyan)">GDACS ↗</a> · <a href="https://reliefweb.int/" target="_blank" style="color:var(--3is-cyan)">ReliefWeb ↗</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS ↗</a> · <a href="https://apps.atmosphere.copernicus.eu/fire-emissions-watch/" target="_blank" style="color:var(--3is-cyan)">Copernicus CAMS ↗</a></p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alcance del proyecto</b></p>
      <p style="margin:4px 0 0">Este monitor apoya "Strengthening Response Capacity in the Amazon Basin", financiado por la Comisión Europea (DG ECHO), implementado del 01/06/2026 al 31/05/2028 por un consorcio liderado por Diakonie Katastrophenhilfe (DKH) junto con World Vision, 3iS y PREDES. Cobertura: Bolivia, Brasil, Colombia, Ecuador, Perú y Venezuela.</p>

  pt: { title:"Mapa de riscos — Bacia amazônica", subtitle:"Eventos ativos por perigo e prioridade", mapNote:"Mapa base OpenStreetMap. Dados: base própria de eventos verificados (ver lista à direita).",

    Brazil:"Brasil", Peru:"Peru", Colombia:"Colômbia", Bolivia:"Bolívia", Ecuador:"Equador", Venezuela:"Venezuela",

    legendShape:"Forma = tipo de perigo", legendColor:"Cor = nível de ameaça", methodology:"Metodologia", info:"Info", borders:"Limites nacionais", alertsPanel:"Alertas",

    bordersNote:"Os dados geográficos, nomes e limites políticos e administrativos utilizados neste mapa não implicam aceitação oficial por parte da 3iS.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Níveis de alerta</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Vermelho</span>: evento maior ou de rápida escalada, com consequências humanitárias, ambientais, agrícolas ou de meios de vida significativas.</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Laranja</span>: evento significativo que exige monitoramento e é potencialmente relevante para ação humanitária ou antecipatória.</p>
      <p style="margin:0 0 12px"><span style="color:#639922">● Verde</span>: evento relevante de impacto limitado, ou em estágio inicial, que exige monitoramento.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Metodologia e fontes</b></p>
      <p style="margin:0 0 4px">Hierarquia de fontes: Nível 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, serviços meteorológicos/geológicos nacionais) → Nível 2 (WFP, IFRC, Cruz Vermelha) → Nível 3 (mídia credenciada) → Nível 4 (redes sociais, apenas como pista, nunca confirmação única).</p>
      <p style="margin:0 0 4px">Cada evento exige verificação cruzada quando possível (idealmente fonte oficial + humanitária, ou fonte oficial + mídia credenciada). Se houver apenas uma fonte confiável: <code>SINGLE_SOURCE</code>. Se as fontes se contradizem: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0">Coordenadas em WGS84 (EPSG:4326). A cobertura geográfica se limita à Bolívia, Brasil, Colômbia, Equador, Peru e Venezuela; um evento dentro de um país elegível não é incluído automaticamente se ocorrer fora da bacia amazônica.</p>

      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Alcance do projeto</b></p>
      <p style="margin:4px 0 0">Este monitor apoia o "Strengthening Response Capacity in the Amazon Basin", financiado pela Comissão Europeia (DG ECHO), implementado de 01/06/2026 a 31/05/2028 por um consórcio liderado pela Diakonie Katastrophenhilfe (DKH), junto com World Vision, 3iS e PREDES. Cobertura: Bolívia, Brasil, Colômbia, Equador, Peru e Venezuela.</p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88;font-size:11px;font-weight:700">Elaborado por:</p>
      <p style="margin:2px 0 0;font-size:11px;font-style:italic">Jerson ACHICANOY — GIS Expert — 3iS<br><a href="mailto:jachicanoy@3is.org" style="color:var(--3is-cyan)">jachicanoy@3is.org</a></p>` },
  en: { title:"Risk map — Amazon Basin", subtitle:"Active events by hazard and priority", mapNote:"Base map: OpenStreetMap. Data: our own base of verified events (see list on the right).",
    total:"Events", red:"Red alerts", countries:"Countries affected",
    all:"All", FLOOD:"Flood", EXTREME_RAIN:"Extreme rain", DROUGHT:"Drought", WILDFIRE:"Wildfire", EARTHQUAKE:"Earthquake", LANDSLIDE:"Landslide",
    Brazil:"Brazil", Peru:"Peru", Colombia:"Colombia", Bolivia:"Bolivia", Ecuador:"Ecuador", Venezuela:"Venezuela",
    RED:"Red", ORANGE:"Orange", GREEN:"Green", updated:"Updated", source:"Source", readMore:"Read more",
    legendShape:"Shape = hazard type", legendColor:"Color = threat level", methodology:"Methodology", info:"Info", borders:"National borders", alertsPanel:"Alerts",
    dateFrom:"From", dateTo:"To", dateClear:"Clear", lastUpdated:"Last updated",
    layerNews:"News", layerFirms:"Satellite Imagery (FIRMS)",
    dataSourcesHTML:`Data sources: <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color:var(--3is-cyan)">OpenStreetMap</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS</a> (VIIRS heat spots) · <a href="https://apps.atmosphere.copernicus.eu/fire-emissions-watch/" target="_blank" style="color:var(--3is-cyan)">Copernicus CAMS — Fire Emissions Watch ↗</a> (animated fire-emissions view, external tool)`,
    bordersNote:"The geographic data, names, and political and administrative boundaries used on this map do not imply official acceptance by 3iS.",
    infoHTML:`<p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Alert levels</b></p>
      <p style="margin:0 0 4px"><span style="color:#E24B4A">● Red</span>: major or rapidly escalating event with significant humanitarian, environmental, agricultural, or livelihood consequences.</p>
      <p style="margin:0 0 4px"><span style="color:#EF9F27">● Orange</span>: significant event requiring monitoring and potentially relevant to humanitarian or anticipatory action.</p>
      <p style="margin:0 0 12px"><span style="color:#639922">● Green</span>: relevant event with limited impacts, or an early-stage event requiring monitoring.</p>
      <p style="margin:0 0 8px"><b style="color:var(--3is-navy)">Methodology and sources</b></p>
      <p style="margin:0 0 4px">Source hierarchy: Tier 1 (GDACS, USGS, WMO, NASA, Copernicus, FAO, OCHA, ReliefWeb, national meteorological/geological services) → Tier 2 (WFP, IFRC, Red Cross) → Tier 3 (credible media) → Tier 4 (social media, lead only, never sole confirmation).</p>
      <p style="margin:0 0 4px">Every event requires cross-checking when possible (ideally official + humanitarian source, or official + credible media). If only one reliable source exists: <code>SINGLE_SOURCE</code>. If sources conflict: <code>CONFLICTING_INFORMATION</code>.</p>
      <p style="margin:0">Coordinates in WGS84 (EPSG:4326). Geographic coverage is limited to Bolivia, Brazil, Colombia, Ecuador, Peru, and Venezuela; an event in an eligible country is not automatically included if it occurs outside the Amazon Basin.</p>
      <p style="margin:8px 0 0"><a href="https://gdacs.org/" target="_blank" style="color:var(--3is-cyan)">GDACS ↗</a> · <a href="https://reliefweb.int/" target="_blank" style="color:var(--3is-cyan)">ReliefWeb ↗</a> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" style="color:var(--3is-cyan)">NASA FIRMS ↗</a> · <a href="https://apps.atmosphere.copernicus.eu/fire-emissions-watch/" target="_blank" style="color:var(--3is-cyan)">Copernicus CAMS ↗</a></p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88"><b style="color:var(--3is-navy)">Project scope</b></p>
      <p style="margin:4px 0 0">This monitor supports "Strengthening Response Capacity in the Amazon Basin," funded by the European Commission (DG ECHO), implemented from 01/06/2026 to 31/05/2028 by a consortium led by Diakonie Katastrophenhilfe (DKH) together with World Vision, 3iS, and PREDES. Coverage: Bolivia, Brazil, Colombia, Ecuador, Peru, and Venezuela.</p>
      <p style="margin:12px 0 0;padding-top:10px;border-top:1px solid #ffffff88;font-size:11px;font-weight:700">Prepared by:</p>
      <p style="margin:2px 0 0;font-size:11px;font-style:italic">Jerson ACHICANOY — GIS Expert — 3iS<br><a href="mailto:jachicanoy@3is.org" style="color:var(--3is-cyan)">jachicanoy@3is.org</a></p>` }
};

let LAST_UPDATED = "";
let EVENTS = [];
let FIRMS_HOTSPOTS = [];

const ICON_PATHS = {
  FLOOD: '<path d="M2 17c1.4 1.3 2.8 1.3 4.2 0 1.4-1.3 2.8-1.3 4.2 0 1.4 1.3 2.8 1.3 4.2 0 1.4-1.3 2.8-1.3 4.2 0"/><path d="M2 21c1.4 1.3 2.8 1.3 4.2 0 1.4-1.3 2.8-1.3 4.2 0 1.4 1.3 2.8 1.3 4.2 0 1.4-1.3 2.8-1.3 4.2 0"/><path d="M12 3v10"/><path d="M8 9l4 4 4-4"/>',
  EXTREME_RAIN: '<path d="M7 15a4 4 0 0 1 .7-7.9 5 5 0 0 1 9.6-1.6A4.5 4.5 0 0 1 17 15H7z"/><path d="M8 18l-1 3"/><path d="M12 18l-1 3"/><path d="M16 18l-1 3"/>',
  DROUGHT: '<circle cx="12" cy="9" r="4"/><path d="M12 1.5v2"/><path d="M12 14.5v2"/><path d="M4.5 9h2"/><path d="M17.5 9h2"/><path d="M6.5 3.5l1.4 1.4"/><path d="M16.1 12.6l1.4 1.4"/><path d="M17.5 3.5l-1.4 1.4"/><path d="M7.9 12.6l-1.4 1.4"/><path d="M3 20l3-3 3 3 3-3 3 3 3-3 3 3"/>',
  WILDFIRE: '<path d="M12 22c4 0 6.5-2.6 6.5-6 0-2.7-1.6-4.3-2.6-5.8-.3.9-.9 1.9-1.7 2.4.3-2.8-.9-5.6-3.3-7.6.2 2-.4 3.7-1.8 5.1-1 1-2.1 2.1-2.1 4.4C6.4 17.9 8 22 12 22z"/>',
  EARTHQUAKE: '<path d="M2 14h3l2-5 3 9 2-11 2 7h2l2-4h4"/>',
  LANDSLIDE: '<path d="M3 20l6-13 4 7 2-3 6 9H3z"/><path d="M2 20h20"/>',
  FLASH_FLOOD: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  DEFORESTATION: '<path d="M12 2l4 6h-2.5l3.5 5.5h-3L18 20H6l3.5-6.5h-3L10 8H7.5z"/><path d="M12 20v2"/>',
  EXTREME_HEAT: '<path d="M12 2v12"/><circle cx="12" cy="17" r="3.5"/><path d="M9.5 8l2.5 2 2.5-2"/>',
  SEVERE_STORM: '<path d="M6 10a4.5 4.5 0 0 1 .7-8.9 6 6 0 0 1 11.3-1.4A5 5 0 0 1 17.5 10H6z"/><path d="M13 13l-3 5h3l-2 4"/>',
  DEFAULT: '<circle cx="12" cy="12" r="8"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16" r="0.8" fill="currentColor" stroke="none"/>'
};

const HAZARD_ORDER = ["WILDFIRE","FLOOD","FLASH_FLOOD","EXTREME_RAIN","DROUGHT","LANDSLIDE","EARTHQUAKE","EXTREME_HEAT","SEVERE_STORM","DEFORESTATION"];

const PRIORITY_COLOR = { RED:"#E24B4A", ORANGE:"#EF9F27", GREEN:"#639922" };
const FIRMS_COLOR = { high:"#E24B4A", nominal:"#EF9F27", low:"#F4B942" };

let currentLang = "es";
let activeCountry = null;
let activeHazard = null;
let dateFrom = null;
let dateTo = null;

let map, newsLayer, firmsLayer, layersControl;

function t(key){ return (DICT[currentLang] && DICT[currentLang][key] !== undefined) ? DICT[currentLang][key] : key; }
function hazardLabel(hz){ return (DICT[currentLang] && DICT[currentLang][hz]) ? DICT[currentLang][hz] : hz; }
function countryLabel(c){ return (DICT[currentLang] && DICT[currentLang][c]) ? DICT[currentLang][c] : c; }
function iconSvg(hz, size){
  size = size || 14;
  var inner = ICON_PATHS[hz] || ICON_PATHS.DEFAULT;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}

function presentHazards(){
  var set = {};
  EVENTS.forEach(function(e){ set[e.hazard] = true; });
  var ordered = HAZARD_ORDER.filter(function(h){ return set[h]; });
  Object.keys(set).forEach(function(h){ if (ordered.indexOf(h) === -1) ordered.push(h); });
  return ordered;
}
function presentCountries(){
  var set = {};
  EVENTS.forEach(function(e){ set[e.country] = true; });
  return Object.keys(set).sort();
}

function inDateRange(e){
  var d = e.eventDate || e.firstDetected;
  if (dateFrom && d < dateFrom) return false;
  if (dateTo && d > dateTo) return false;
  return true;
}
function getFiltered(){
  return EVENTS.filter(function(e){
    if (activeCountry && e.country !== activeCountry) return false;
    if (activeHazard && e.hazard !== activeHazard) return false;
    if (!inDateRange(e)) return false;
    return true;
  });
}

function renderCountryFilters(){
  var wrap = document.getElementById('countryFilters');
  wrap.innerHTML = '';
  var allChip = document.createElement('button');
  allChip.className = 'chip' + (activeCountry ? '' : ' active');
  allChip.textContent = t('all');
  allChip.onclick = function(){ activeCountry = null; renderAll(); };
  wrap.appendChild(allChip);
  presentCountries().forEach(function(c){
    var chip = document.createElement('button');
    chip.className = 'chip' + (activeCountry === c ? ' active' : '');
    chip.textContent = countryLabel(c);
    chip.onclick = function(){ activeCountry = (activeCountry === c) ? null : c; renderAll(); };
    wrap.appendChild(chip);
  });
}

function renderHazardFilters(){
  var wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  var allChip = document.createElement('button');
  allChip.className = 'chip' + (activeHazard ? '' : ' active');
  allChip.textContent = t('all');
  allChip.onclick = function(){ activeHazard = null; renderAll(); };
  wrap.appendChild(allChip);
  presentHazards().forEach(function(hz){
    var chip = document.createElement('button');
    chip.className = 'chip' + (activeHazard === hz ? ' active' : '');
    chip.style.display = 'inline-flex';
    chip.style.alignItems = 'center';
    chip.style.gap = '5px';
    chip.innerHTML = iconSvg(hz,13) + '<span>' + hazardLabel(hz) + '</span>';
    chip.onclick = function(){ activeHazard = (activeHazard === hz) ? null : hz; renderAll(); };
    wrap.appendChild(chip);
  });
}

function renderLegend(){
  var wrap = document.getElementById('legend');
  wrap.innerHTML = '';
  var shapeBlock = document.createElement('div');
  shapeBlock.style.display = 'flex'; shapeBlock.style.flexWrap = 'wrap'; shapeBlock.style.gap = '10px'; shapeBlock.style.alignItems='center';
  var shapeLabel = document.createElement('span');
  shapeLabel.textContent = t('legendShape') + ':';
  shapeLabel.style.fontWeight = '600';
  shapeBlock.appendChild(shapeLabel);
  presentHazards().forEach(function(hz){
    var item = document.createElement('span');
    item.style.display = 'inline-flex'; item.style.alignItems = 'center'; item.style.gap='4px';
    item.style.background = 'var(--3is-aqua-tint)'; item.style.padding = '3px 8px'; item.style.borderRadius = '999px'; item.style.color='var(--3is-teal-deep)';
    item.innerHTML = iconSvg(hz,13) + '<span>' + hazardLabel(hz) + '</span>';
    shapeBlock.appendChild(item);
  });
  var colorBlock = document.createElement('div');
  colorBlock.style.display = 'flex'; colorBlock.style.flexWrap='wrap'; colorBlock.style.gap='10px'; colorBlock.style.alignItems='center';
  var colorLabel = document.createElement('span');
  colorLabel.textContent = t('legendColor') + ':';
  colorLabel.style.fontWeight = '600';
  colorBlock.appendChild(colorLabel);
  ['RED','ORANGE','GREEN'].forEach(function(p){
    var item = document.createElement('span');
    item.style.display='inline-flex'; item.style.alignItems='center'; item.style.gap='4px';
    item.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+PRIORITY_COLOR[p]+'"></span><span>'+t(p)+'</span>';
    colorBlock.appendChild(item);
  });
  wrap.appendChild(shapeBlock);
  wrap.appendChild(colorBlock);
}

function renderStats(filtered){
  var wrap = document.getElementById('stats');
  wrap.innerHTML = '';
  var total = filtered.length;
  var red = filtered.filter(function(e){ return e.priority === 'RED'; }).length;
  var countries = {};
  filtered.forEach(function(e){ countries[e.country] = true; });
  var cards = [
    [t('total'), total],
    [t('red'), red],
    [t('countries'), Object.keys(countries).length]
  ];
  cards.forEach(function(c){
    var card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = '<p>'+c[0]+'</p><p>'+c[1]+'</p>';
    wrap.appendChild(card);
  });
}

function eventPopupHtml(e){
  var srcHtml = (e.sources || []).map(function(s){
    return '<a href="'+s.url+'" target="_blank" style="color:var(--3is-cyan)">'+ (s.label||t('source')) +' ↗</a>';
  }).join(' · ');
  var title = (e.title && e.title[currentLang]) || e.id;
  var desc = (e.desc && e.desc[currentLang]) || '';
  return '<div style="max-width:260px;font-size:13px">'+
    '<p style="margin:0 0 4px;font-weight:700;color:var(--3is-navy)">'+title+'</p>'+
    '<p style="margin:0 0 6px;color:var(--text-muted)">'+countryLabel(e.country)+' · '+hazardLabel(e.hazard)+' · <span style="color:'+PRIORITY_COLOR[e.priority]+';font-weight:600">'+t(e.priority)+'</span></p>'+
    '<p style="margin:0 0 6px">'+desc+'</p>'+
    '<p style="margin:0 0 4px;color:var(--text-muted)">'+t('updated')+': '+e.lastUpdated+'</p>'+
    (srcHtml ? '<p style="margin:0">'+t('source')+': '+srcHtml+'</p>' : '') +
  '</div>';
}

function renderMarkers(filtered){
  if (!newsLayer) return;
  newsLayer.clearLayers();
  filtered.forEach(function(e){
    if (typeof e.lat !== 'number' || typeof e.lon !== 'number' || isNaN(e.lat) || isNaN(e.lon)) return;
    var color = PRIORITY_COLOR[e.priority] || PRIORITY_COLOR.GREEN;
    var html = '<div style="background:'+color+';color:#fff;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff">'+
      '<span style="transform:rotate(-45deg);display:flex">'+iconSvg(e.hazard,14)+'</span></div>';
    var icon = L.divIcon({ html: html, className: '', iconSize: [26,26], iconAnchor: [13,26], popupAnchor: [0,-24] });
    var marker = L.marker([e.lat, e.lon], { icon: icon });
    marker.bindPopup(eventPopupHtml(e));
    marker.addTo(newsLayer);
  });
}

function renderFirmsMarkers(){
  if (!firmsLayer) return;
  firmsLayer.clearLayers();
  (typeof FIRMS_HOTSPOTS !== 'undefined' ? FIRMS_HOTSPOTS : []).forEach(function(p){
    var color = FIRMS_COLOR[p.confidence] || FIRMS_COLOR.nominal;
    var m = L.circleMarker([p.lat, p.lon], {
      radius: 3.5, color: color, weight: 1, fillColor: color, fillOpacity: 0.75
    });
    m.bindPopup('<div style="font-size:12px"><b>'+t('layerFirms')+'</b><br>'+p.satellite+' · '+p.date+' · '+p.confidence+'</div>');
    m.addTo(firmsLayer);
  });
}

function renderList(filtered){
  var wrap = document.getElementById('list');
  wrap.innerHTML = '';
  var byCountry = {};
  filtered.forEach(function(e){
    (byCountry[e.country] = byCountry[e.country] || []).push(e);
  });
  Object.keys(byCountry).sort().forEach(function(c){
    var h = document.createElement('p');
    h.style.fontWeight = '800'; h.style.fontSize = '15px'; h.style.color = 'var(--3is-navy)'; h.style.margin = '14px 0 6px';
    h.textContent = countryLabel(c);
    wrap.appendChild(h);
    byCountry[c].sort(function(a,b){ return (b.eventDate||'').localeCompare(a.eventDate||''); }).forEach(function(e){
      var card = document.createElement('div');
      card.style.border = '1px solid var(--3is-gray)'; card.style.borderRadius = 'var(--radius)'; card.style.padding = '10px 12px'; card.style.marginBottom = '8px'; card.style.background = '#fff'; card.style.cursor = 'pointer';
      var title = (e.title && e.title[currentLang]) || e.id;
      var srcHtml = (e.sources||[]).map(function(s){ return '<a href="'+s.url+'" target="_blank" style="color:var(--3is-cyan)" onclick="event.stopPropagation()">'+(s.label||t('source'))+' ↗</a>'; }).join(' · ');
      card.innerHTML = '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'+
        '<span style="width:9px;height:9px;border-radius:50%;background:'+(PRIORITY_COLOR[e.priority]||PRIORITY_COLOR.GREEN)+';flex:none"></span>'+
        '<span style="color:var(--3is-teal-deep);display:inline-flex">'+iconSvg(e.hazard,13)+'</span>'+
        '<span style="font-size:12px;color:var(--text-muted)">'+hazardLabel(e.hazard)+' · '+ (e.eventDate||e.firstDetected) +'</span>'+
        '</div>'+
        '<p style="margin:0 0 4px;font-size:13px;font-weight:600;color:var(--3is-navy)">'+title+'</p>'+
        (srcHtml ? '<p style="margin:0;font-size:11px">'+srcHtml+'</p>' : '');
      card.onclick = function(){
        if (typeof e.lat === 'number' && typeof e.lon === 'number' && map) {
          map.setView([e.lat, e.lon], 8);
          L.popup().setLatLng([e.lat, e.lon]).setContent(eventPopupHtml(e)).openOn(map);
        }
      };
      wrap.appendChild(card);
    });
  });
}

function applyI18nText(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    var val = t(key);
    if (key === 'dataSourcesHTML') { el.innerHTML = val; }
    else { el.textContent = val; }
  });
  var dsEl = document.getElementById('dataSources');
  if (dsEl) dsEl.innerHTML = t('dataSourcesHTML');
  var infoEl = document.getElementById('infoPanel');
  if (infoEl) infoEl.innerHTML = t('infoHTML');
  var luEl = document.getElementById('lastUpdated');
  if (luEl) luEl.textContent = t('lastUpdated') + ': ' + LAST_UPDATED;
  if (layersControl) {
    layersControl.remove();
    buildLayersControl();
  }
}

function renderAll(){
  var filtered = getFiltered();
  renderCountryFilters();
  renderHazardFilters();
  renderLegend();
  renderStats(filtered);
  renderMarkers(filtered);
  renderList(filtered);
}

function buildLayersControl(){
  var baseLayers = {};
  baseLayers['OpenStreetMap'] = window.__osmLayer;
  baseLayers['Satellite'] = window.__satLayer;
  var overlays = {};
  overlays[t('borders')] = window.__bordersLayer;
  overlays[t('layerNews')] = newsLayer;
  overlays[t('layerFirms')] = firmsLayer;
  layersControl = L.control.layers(baseLayers, overlays, { position: 'topright', collapsed: true }).addTo(map);
}

function initMap(){
  map = L.map('map', { scrollWheelZoom: true }).setView([-6, -66], 4);

  window.__osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 18
  }).addTo(map);

  window.__satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri World Imagery', maxZoom: 18
  });

  window.__bordersLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Boundaries & Places', maxZoom: 18, opacity: 0.9
  });

  newsLayer = L.layerGroup().addTo(map);
  firmsLayer = L.layerGroup().addTo(map);

  buildLayersControl();
}

function wireControls(){
  document.getElementById('lang').addEventListener('change', function(e){
    currentLang = e.target.value;
    applyI18nText();
    renderAll();
  });
  document.getElementById('infoBtn').addEventListener('click', function(){
    var p = document.getElementById('infoPanel');
    p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';
  });
  document.getElementById('dateFrom').addEventListener('change', function(e){ dateFrom = e.target.value || null; renderAll(); });
  document.getElementById('dateTo').addEventListener('change', function(e){ dateTo = e.target.value || null; renderAll(); });
  document.getElementById('dateClear').addEventListener('click', function(){
    dateFrom = null; dateTo = null;
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    renderAll();
  });
}

function initDashboard(){
  document.getElementById('lang').value = currentLang;
  applyI18nText();
  initMap();
  wireControls();
  renderFirmsMarkers();
  renderAll();
}

document.addEventListener('DOMContentLoaded', function(){
  Promise.all([
    fetch('./events.json').then(function(r){ return r.json(); }),
    fetch('./firms_hotspots.json').then(function(r){ return r.json(); }),
    fetch('./meta.json').then(function(r){ return r.json(); })
  ]).then(function(results){
    EVENTS = results[0];
    FIRMS_HOTSPOTS = results[1];
    LAST_UPDATED = (results[2] && results[2].lastUpdated) ? results[2].lastUpdated : '';
    initDashboard();
  }).catch(function(err){
    console.error('Error cargando datos del monitor:', err);
    EVENTS = [];
    FIRMS_HOTSPOTS = [];
    LAST_UPDATED = '';
    initDashboard();
  });
});
</script>
</body>
</html>
