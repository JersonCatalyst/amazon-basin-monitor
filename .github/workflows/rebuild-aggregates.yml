# Sube este archivo al repo en la ruta exacta: .github/workflows/rebuild-aggregates.yml
# (reemplaza la version anterior que subiste - esta corrige un bug real)
#
# Que hace: cada vez que se agrega o modifica un archivo en Events/, reconstruye
# index.json, events.json, meta.json y los CSV trimestrales-reporte a partir de
# los archivos individuales de Events/ (la fuente de verdad). Es 100% determinista
# (scripts/rebuild_aggregates.py) - no llama a ningun modelo ni API externa, por
# lo que no tiene costo de tokens y corre en segundos.
#
# Se dispara por push sobre Events/** (inmediato, sin depender de un cron que
# tenga que adivinar si Cowork ya termino) y tambien admite correrse a mano
# desde la pestana "Actions" del repo.

name: Reconstruir agregados desde Events/

on:
  push:
    paths:
      - "Events/**"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit y push

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruir index.json, events.json, meta.json y CSV trimestrales
        run: python scripts/rebuild_aggregates.py

      - name: Hacer commit y push solo si algo cambio
        run: |
          shopt -s nullglob
          git config user.name "amazon-basin-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          archivos=(index.json events.json meta.json Amazon_Basin_Disaster_Events_*.csv)
          git add "${archivos[@]}"
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar hoy."
          else
            git commit -m "Reconstruccion automatica de agregados ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
