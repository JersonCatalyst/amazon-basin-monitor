# Subir este archivo al repo en la ruta exacta: .github/workflows/publish.yml
#
# Que hace: cada dia (y tambien cuando lo corras manualmente desde la pestana
# "Actions"), descarga los datos mas recientes y los publica en el repo, lo
# que dispara automaticamente una reconstruccion de GitHub Pages.

name: Actualizar datos del monitor

on:
  schedule:
    # Formato: minuto hora dia-mes mes dia-semana, en UTC (NO en hora de Bogota).
    # Bogota es UTC-5 todo el ano (no tiene horario de verano), asi que
    # 10:00 America/Bogota = 15:00 UTC.
    # Corre 1 hora despues de la tarea diaria de Cowork (09:00 America/Bogota).
    # Ya no descarga nada de SharePoint: events.json/meta.json/index.json los
    # reconstruye rebuild-aggregates.yml desde Events/. Este workflow solo
    # actualiza FIRMS y SST.
    - cron: "0 15 * * *"
  workflow_dispatch: {}  # permite darle "Run workflow" manualmente desde GitHub

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit y push

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (Earth Engine para SST/ENSO; shapely para recortar FIRMS a la forma real de la cuenca)
        run: pip install earthengine-api shapely

      - name: Actualizar firms_hotspots.json y sst_layer.json
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_and_publish.py

      - name: Hacer commit y push solo si algo cambio
        run: |
          git config user.name "amazon-basin-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add firms_hotspots.json
          # sst_layer.json es opcional: todavia no existe hasta que se complete
          # la integracion con Earth Engine (ver setup_enso_sst_climatology.py
          # y los secrets GEE_*). "git add" con -e activo tumbaria el paso
          # entero si el archivo no existe, por eso se agrega solo si esta.
          if [ -f sst_layer.json ]; then
            git add sst_layer.json
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar hoy."
          else
            git commit -m "Actualizacion automatica de datos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
